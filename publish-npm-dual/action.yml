name: 'Dual-Registry NPM Package Publisher (npmjs.org + Private Gitea/Gitee)'
description: 'Idempotentna publikacja paczki NPM (weryfikuje czy wersja już istnieje, sprawdza zawartość tarballa przez npm pack --dry-run i publikuje na registry.npmjs.org oraz prywatny rejestr).'
inputs:
  working_directory:
    description: 'Katalog paczki z package.json'
    required: false
    default: '.'
  run_build:
    description: 'Czy uruchamiać npm run build przed publikacją (true/false)'
    required: false
    default: 'false'
  publish_npmjs:
    description: 'Publikuj na publicznym registry.npmjs.org (true/false)'
    required: false
    default: 'true'
  publish_private:
    description: 'Publikuj w prywatnym rejestrze Gitea/Gitee (true/false)'
    required: false
    default: 'true'
  private_registry_url:
    description: 'URL prywatnego rejestru NPM (domyślnie wyliczany dynamicznie z kontekstu serwera i właściciela)'
    required: false
    default: ''
  gitea_owner:
    description: 'Właściciel lub organizacja w Gitea / GitHub (domyślnie wykrywany z kontekstu repozytorium)'
    required: false
    default: ''
  npm_token:
    description: 'Token autoryzacyjny do registry.npmjs.org'
    required: false
    default: ''
  private_token:
    description: 'Token autoryzacyjny do prywatnego rejestru'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build Package (if enabled) & Inspect Clean Tarball
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        RUN_BUILD: ${{ inputs.run_build }}
      run: |
        if [ "$RUN_BUILD" = "true" ]; then
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (pkg.scripts && pkg.scripts.build) {
            execSync(fs.existsSync("package-lock.json") ? "npm ci" : "npm install", { stdio: "inherit" });
            execSync("npm run build", { stdio: "inherit" });
          }
          '
        fi
        npm pack --dry-run

    - name: Publish to Private Registry (Gitea / Gitee — Primary)
      if: ${{ inputs.publish_private == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.private_token }}
        PRIVATE_REGISTRY: ${{ inputs.private_registry_url }}
        GITEA_SERVER_URL: ${{ github.server_url }}
        GITEA_API_URL: ${{ github.api_url }}
        GITEA_REPO_FULL: ${{ github.repository }}
        GITEA_OWNER_INPUT: ${{ inputs.gitea_owner }}
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "⚠️ private_token is empty, skipping private registry publish."
          exit 0
        fi
        REG_CLEAN=$(node -e '
          const fs = require("fs");
          const explicit = String(process.env.PRIVATE_REGISTRY || "").trim();
          if (explicit) { console.log(explicit.replace(/\/+$/, "") + "/"); process.exit(0); }
          let npmrcReg = "";
          if (fs.existsSync(".npmrc")) {
            for (const l of fs.readFileSync(".npmrc", "utf8").split("\n")) {
              const m = l.trim().match(/^(?:@[^:=\s]+:)?registry\s*=\s*(\S+)/);
              if (m && !m[1].includes("registry.npmjs.org")) { npmrcReg = m[1]; break; }
            }
          }
          if (npmrcReg) { console.log(npmrcReg.replace(/\/+$/, "") + "/"); process.exit(0); }
          let srv = "";
          try { srv = new URL(String(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL || "").trim()).origin; } catch {}
          const repoFull = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
          const owner = String(process.env.GITEA_OWNER_INPUT || process.env.GITHUB_REPOSITORY_OWNER || (repoFull.includes("/") ? repoFull.split("/")[0] : "")).trim();
          if (srv && owner && !srv.includes("github.com")) {
            console.log(`${srv}/api/packages/${encodeURIComponent(owner)}/npm/`);
          }
        ')
        if [ -z "$REG_CLEAN" ]; then
          echo "⚠️ private_registry_url could not be resolved, skipping private registry publish."
          exit 0
        fi
        TMP_NPMRC=$(mktemp)
        cp package.json package.json.bak
        trap 'mv -f package.json.bak package.json 2>/dev/null || true; rm -f "$TMP_NPMRC"' EXIT
        node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json.bak","utf8"));if(p.private){delete p.private;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");}'
        NAME=$(node -p "require('./package.json').name")
        VER=$(node -p "require('./package.json').version")
        SCOPE=$(node -p "const n=require('./package.json').name; n.startsWith('@') ? n.split('/')[0] : ''")
        REG_HOST=$(echo "$REG_CLEAN" | sed -E 's|^https?://||')
        if [ -n "$SCOPE" ]; then
          printf "%s:registry=%s\n" "$SCOPE" "$REG_CLEAN" >> "$TMP_NPMRC"
        fi
        printf "registry=%s\n//%s:_authToken=%s\nalways-auth=true\n" "$REG_CLEAN" "$REG_HOST" "$NODE_AUTH_TOKEN" >> "$TMP_NPMRC"
        if NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "${NAME}@${VER}" --registry="$REG_CLEAN" version >/dev/null 2>&1; then
          echo "ℹ️ ${NAME}@${VER} is already published in private registry — skipping upload."
        else
          NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm publish --registry="$REG_CLEAN" || echo "ℹ️ Private registry publish skipped (version already exists or token unauthorized)."
        fi
        mv -f package.json.bak package.json
        # Automatically link package to its Gitea repository so package visibility strictly inherits repo Private/Public status
        node -e '
        (async () => {
          const repoFull = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
          const token = process.env.NODE_AUTH_TOKEN || "";
          const pkgName = process.argv[1];
          if (!repoFull.includes("/") || !token || !pkgName) return;
          let srv = "";
          try { srv = new URL(String(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL || "").trim()).origin; } catch {}
          const apiBase = (String(process.env.GITEA_API_URL || process.env.GITHUB_API_URL || "").trim() || (srv ? srv + "/api/v1" : "")).replace(/\/+$/, "");
          if (!apiBase || apiBase.includes("api.github.com")) return;
          const [owner, repoName] = repoFull.split("/");
          const ownerResolved = String(process.env.GITEA_OWNER_INPUT || owner).trim();
          const url = `${apiBase}/packages/${encodeURIComponent(ownerResolved)}/npm/${encodeURIComponent(pkgName)}/-/link/${encodeURIComponent(repoName)}`;
          try {
            const res = await fetch(url, { method: "POST", headers: { Authorization: `token ${token}` } });
            console.log(`🔗 [Gitea Package Link] Linked ${pkgName} -> ${repoFull} (HTTP ${res.status})`);
          } catch {}
        })();
        ' "$NAME"

    - name: Publish to Public NPM Registry (registry.npmjs.org — Secondary, Public-Only Gate)
      if: ${{ inputs.publish_npmjs == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm_token }}
        GITEA_SERVER_URL: ${{ github.server_url }}
        GITEA_API_URL: ${{ github.api_url }}
        GITEA_REPO_FULL: ${{ github.repository }}
      run: |
        # Dual-SSoT Privacy Gate: block public publish if package.json is UNLICENSED/private OR if Gitea repo is Private
        ALLOW_PUBLIC=$(node -e '
        const fs = require("fs");
        const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
        const lic = String(pkg.license || "").trim().toUpperCase();
        if (pkg.private === true || !lic || lic === "UNLICENSED" || lic === "PROPRIETARY") {
          console.error(`🔒 [Privacy Gate] package.json declares private=${Boolean(pkg.private)} license="${pkg.license || "NONE"}" — strictly blocking public npmjs.org publish.`);
          console.log("BLOCK");
          process.exit(0);
        }
        const repoFull = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
        let srv = "";
        try { srv = new URL(String(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL || "").trim()).origin; } catch {}
        const apiBase = (String(process.env.GITEA_API_URL || process.env.GITHUB_API_URL || "").trim() || (srv ? srv + "/api/v1" : "")).replace(/\/+$/, "");
        if (!repoFull.includes("/") || !apiBase) {
          console.log("ALLOW");
          process.exit(0);
        }
        fetch(`${apiBase}/repos/${repoFull}`)
          .then(r => {
            if (r.status !== 200) {
              console.error(`🔒 [Privacy Gate] Repository ${repoFull} is PRIVATE (unauthenticated HTTP ${r.status}) — strictly blocking public npmjs.org publish.`);
              console.log("BLOCK");
            } else {
              console.log("ALLOW");
            }
          })
          .catch(() => console.log("ALLOW"));
        ')
        if [ "$ALLOW_PUBLIC" != "ALLOW" ]; then
          exit 0
        fi
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "⚠️ npm_token is empty, skipping registry.npmjs.org publish."
          exit 0
        fi
        TMP_NPMRC=$(mktemp)
        trap 'rm -f "$TMP_NPMRC"' EXIT
        NAME=$(node -p "require('./package.json').name")
        VER=$(node -p "require('./package.json').version")
        SCOPE=$(node -p "const n=require('./package.json').name; n.startsWith('@') ? n.split('/')[0] : ''")
        if [ -n "$SCOPE" ]; then
          printf "%s:registry=https://registry.npmjs.org/\n" "$SCOPE" >> "$TMP_NPMRC"
        fi
        printf "registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" >> "$TMP_NPMRC"
        if NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "${NAME}@${VER}" --registry="https://registry.npmjs.org/" version >/dev/null 2>&1; then
          echo "ℹ️ ${NAME}@${VER} is already published on registry.npmjs.org — skipping."
          exit 0
        fi
        NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm publish --registry="https://registry.npmjs.org/" --access public || echo "⚠️ Public npmjs.org publish skipped (token expired, 2FA required, or version already exists)."
