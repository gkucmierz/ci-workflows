name: 'Zero-Downtime Docker Build & Atomic Nginx Hot-Swap'
description: 'Buduje obraz Docker Compose podczas działania kontenera, wykonuje atomowy hot-swap statycznych plików Nginx (0 ms downtime, zachowane IP w npm_public) oraz przeładowuje DNS w Nginx Proxy Manager.'
inputs:
  container_name:
    description: 'Nazwa kontenera docelowego (np. science-blog)'
    required: true
  hot_swap_static:
    description: 'Czy wykonywać atomowy hot-swap /usr/share/nginx/html dla kontenerów statycznych Nginx (true/false)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Build and Deploy with Zero-Downtime
      shell: bash
      run: |
        CONTAINER="${{ inputs.container_name }}"
        HOT_SWAP="${{ inputs.hot_swap_static }}"

        docker compose build

        if [ "$HOT_SWAP" = "true" ] && [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
          IMG_NAME=$(docker compose config --images 2>/dev/null | head -n 1)
          IMG_ID=$(docker image inspect -f '{{.Id}}' "$IMG_NAME" 2>/dev/null | head -n 1)
          if [ -n "$IMG_ID" ]; then
            echo "⚡ Hot-swapping static assets from newly built image $IMG_NAME ($IMG_ID) into $CONTAINER..."
            TMP_CID=$(docker create "$IMG_ID")
            TMP_DIR=$(mktemp -d)
            docker cp "$TMP_CID:/usr/share/nginx/html/." "$TMP_DIR/"
            docker cp "$TMP_DIR/." "$CONTAINER:/usr/share/nginx/html/"
            docker cp "$TMP_CID:/etc/nginx/conf.d/default.conf" "$TMP_DIR/default.conf" 2>/dev/null && docker cp "$TMP_DIR/default.conf" "$CONTAINER:/etc/nginx/conf.d/default.conf" 2>/dev/null || true
            rm -rf "$TMP_DIR"
            docker rm -f "$TMP_CID" >/dev/null 2>&1 || true
            docker exec "$CONTAINER" nginx -s reload
          else
            docker compose up -d --remove-orphans
          fi
        else
          docker compose up -d --remove-orphans
        fi

        for npm_cid in $(docker ps -q --filter "ancestor=jc21/nginx-proxy-manager" --filter "status=running"); do
          docker exec "$npm_cid" nginx -s reload 2>/dev/null || true
        done
