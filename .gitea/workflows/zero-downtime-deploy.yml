name: Reusable Zero-Downtime Build & Deploy (with Dependency Readiness Gate)

on:
  workflow_call:
    inputs:
      container_name:
        description: 'Nazwa kontenera Docker (np. science-blog)'
        required: true
        type: string
      runs_on:
        description: 'Etykieta runnera Gitea (self-hosted-pl lub self-hosted-de)'
        required: false
        type: string
        default: 'self-hosted-pl'
      hot_swap_static:
        description: 'Atomowy hot-swap statycznych plików Nginx (true dla SPA/VitePress, false dla backendów Node)'
        required: false
        type: boolean
        default: true
      wait_timeout_sec:
        description: 'Limit czasu oczekiwania na publikację zależności @gkucmierz/* w NPM (s)'
        required: false
        type: number
        default: 180
      healthcheck_url:
        description: 'Opcjonalny URL lokalnego smoke-testu HTTP po wdrożeniu (np. http://localhost:6162/)'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy (${{ inputs.container_name }})
    runs-on: ${{ inputs.runs_on || 'self-hosted-pl' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Wait for @gkucmierz/* dependencies (NPM & Gitea Packages)
        env:
          WAIT_FOR_DEPS_TIMEOUT_SEC: ${{ inputs.wait_timeout_sec }}
          GITEA_PKG_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || gitea.token }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");
          const giteaToken = process.env.GITEA_PKG_TOKEN || "";
          const files = ["package.json", "ui/package.json", "server/package.json", "crawler/package.json", "client/package.json", "app/package.json", "web/package.json"].filter(f => fs.existsSync(f));
          const cmp = (a, b) => {
            const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
            for (let i = 0; i < 3; i++) if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
            return 0;
          };
          const UNSCOPED_INTERNAL_PKGS = new Set(["i18n-scroll-restore", "vue-url-cleaner"]);
          const isInternalDep = (name, verSpec) => {
            if (!name) return false;
            if (name.startsWith("@gkucmierz/")) return true;
            if (UNSCOPED_INTERNAL_PKGS.has(name)) return true;
            if (String(verSpec || "").includes("gitea.7u.pl")) return true;
            return false;
          };
          const extractMinVer = (verSpec) => {
            const s = String(verSpec || "");
            const urlMatch = s.match(/\/-\/(\d+\.\d+\.\d+)(?:\/|$)/) || s.match(/-(\d+\.\d+\.\d+)\.tgz/);
            if (urlMatch) return urlMatch[1];
            return s.replace(/^[^\d]*/, "").split("-")[0] || "0.0.0";
          };
          const selfNames = new Set();
          const deps = new Map();
          for (const f of files) {
            const p = JSON.parse(fs.readFileSync(f, "utf8"));
            if (p.name) selfNames.add(p.name);
            for (const [k, v] of Object.entries({ ...(p.dependencies || {}), ...(p.devDependencies || {}) })) {
              if (isInternalDep(k, v) && !String(v).startsWith("file:")) {
                const ver = extractMinVer(v);
                if (!deps.has(k) || cmp(ver, deps.get(k)) > 0) {
                  deps.set(k, ver);
                }
              }
            }
          }
          for (const s of selfNames) deps.delete(s);
          const buildHeaders = (url) => {
            const h = { "Cache-Control": "no-cache" };
            if (giteaToken && (String(url).includes("gitea.7u.pl") || String(url).includes("gitea:3000"))) {
              h["Authorization"] = "token " + giteaToken;
            }
            return h;
          };
          const rewriteInternalGiteaUrl = (url) => {
            if (!url) return url;
            return String(url).replace(/^https:\/\/gitea\.7u\.pl\//, "http://gitea:3000/");
          };
          const queryReg = async (baseUrl, name, minVer) => {
            try {
              const url = baseUrl + name.replace("/", "%2f") + "?t=" + Date.now();
              const res = await fetch(url, { headers: buildHeaders(url) });
              if (!res.ok) return null;
              const data = await res.json();
              const vers = Object.keys(data.versions || {}).filter(v => cmp(v, minVer) >= 0).sort(cmp);
              if (vers.length === 0) return null;
              const latest = vers[vers.length - 1];
              const tarball = data.versions?.[latest]?.dist?.tarball || null;
              return { version: latest, tarball };
            } catch {
              return null;
            }
          };
          const autoHealDispatched = new Set();
          const triggerUpstreamSelfHeal = async (pkgName, minVer) => {
            if (autoHealDispatched.has(pkgName) || !giteaToken) return;
            autoHealDispatched.add(pkgName);
            const repoName = pkgName.replace(/^@gkucmierz\//, "");
            for (const apiBase of ["http://gitea:3000/api/v1", "https://gitea.7u.pl/api/v1"]) {
              for (const wf of ["publish.yml", "publish.yaml", "build.yml", "build.yaml", "deploy.yml", "deploy.yaml"]) {
                try {
                  const res = await fetch(`${apiBase}/repos/gkucmierz/${repoName}/actions/workflows/${wf}/dispatches`, {
                    method: "POST",
                    headers: {
                      "Authorization": "token " + giteaToken,
                      "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ ref: "main" })
                  });
                  if (res.status === 204 || res.status === 200 || res.status === 201) {
                    console.log(`🩺 [self-heal] Auto-triggered workflow ${wf} for gkucmierz/${repoName} (waiting for ${pkgName}>=${minVer})`);
                    return;
                  }
                } catch {}
              }
            }
          };
          (async () => {
            const deadline = Date.now() + (Number(process.env.WAIT_FOR_DEPS_TIMEOUT_SEC || 180) * 1000);
            const resolvedBuffers = new Map();
            const queue = Array.from(deps.entries());
            while (queue.length > 0) {
              const [name, minVer] = queue.shift();
              if (resolvedBuffers.has(name) && cmp(resolvedBuffers.get(name).version, minVer) >= 0) continue;
              let hit = null;
              while (true) {
                const [internalGiteaHit, giteaHit, npmHit] = await Promise.all([
                  queryReg("http://gitea:3000/api/packages/gkucmierz/npm/", name, minVer),
                  queryReg("https://gitea.7u.pl/api/packages/gkucmierz/npm/", name, minVer),
                  queryReg("https://registry.npmjs.org/", name, minVer)
                ]);
                const candidates = [
                  internalGiteaHit && internalGiteaHit.tarball
                    ? { ...internalGiteaHit, tarball: rewriteInternalGiteaUrl(internalGiteaHit.tarball), label: "Gitea Internal", prio: 3 }
                    : null,
                  giteaHit && giteaHit.tarball
                    ? { ...giteaHit, label: "Gitea Packages", prio: 2 }
                    : null,
                  npmHit && npmHit.tarball
                    ? { ...npmHit, label: "npmjs", prio: 1 }
                    : null
                ].filter(Boolean);
                if (candidates.length > 0) {
                  candidates.sort((a, b) => {
                    const vDiff = cmp(b.version, a.version);
                    return vDiff !== 0 ? vDiff : b.prio - a.prio;
                  });
                  hit = candidates[0];
                  console.log("✅ [wait-for-deps] " + name + " >= " + minVer + " dostępny w " + hit.label + " (" + hit.version + ")");
                  break;
                }
                await triggerUpstreamSelfHeal(name, minVer);
                if (Date.now() >= deadline) {
                  console.error("❌ [wait-for-deps] Timeout oczekiwania na " + name + ">=" + minVer + " (npmjs + Gitea Packages)");
                  process.exit(1);
                }
                console.log("⏳ [wait-for-deps] Czekam 5s na publikację " + name + ">=" + minVer + " (Gitea Packages / npmjs)...");
                await new Promise(r => setTimeout(r, 5000));
              }
              let tRes = await fetch(hit.tarball, { headers: buildHeaders(hit.tarball) }).catch(() => null);
              if ((!tRes || !tRes.ok) && String(hit.tarball).includes("gitea.7u.pl")) {
                const altUrl = rewriteInternalGiteaUrl(hit.tarball);
                tRes = await fetch(altUrl, { headers: buildHeaders(altUrl) }).catch(() => null);
              }
              if (!tRes || !tRes.ok) {
                console.error("❌ [wait-for-deps] Nie udało się pobrać tarballa " + hit.tarball + " (HTTP " + (tRes ? tRes.status : "ERR") + ")");
                process.exit(1);
              }
              let buf = Buffer.from(await tRes.arrayBuffer());
              const safeFile = name.replace(/^@/, "").replace(/\//g, "-") + ".tgz";
              try {
                const tmpTgz = path.join("/tmp", safeFile);
                fs.writeFileSync(tmpTgz, buf);
                const innerPkgRaw = execFileSync("tar", ["-xzOf", tmpTgz, "package/package.json"], { encoding: "utf8" });
                const innerPkg = JSON.parse(innerPkgRaw);
                let innerModified = false;
                for (const [tk, tv] of Object.entries(innerPkg.dependencies || {})) {
                  if (isInternalDep(tk, tv) && !selfNames.has(tk)) {
                    const tVer = extractMinVer(tv);
                    if (!resolvedBuffers.has(tk) || cmp(tVer, resolvedBuffers.get(tk).version) > 0) {
                      queue.push([tk, tVer]);
                    }
                    if (String(tv).includes("gitea.7u.pl")) {
                      innerPkg.dependencies[tk] = "^" + (tVer === "0.0.0" ? "1.0.0" : tVer);
                      innerModified = true;
                    }
                  }
                }
                if (innerModified) {
                  const repackDir = path.join("/tmp", "repack-" + Date.now() + "-" + Math.random().toString(36).slice(2));
                  fs.mkdirSync(repackDir, { recursive: true });
                  execFileSync("tar", ["-xzf", tmpTgz, "-C", repackDir]);
                  fs.writeFileSync(path.join(repackDir, "package", "package.json"), JSON.stringify(innerPkg, null, 2) + "\n");
                  execFileSync("tar", ["-czf", tmpTgz, "-C", repackDir, "package"]);
                  buf = fs.readFileSync(tmpTgz);
                  fs.rmSync(repackDir, { recursive: true, force: true });
                }
                fs.unlinkSync(tmpTgz);
              } catch {}
              resolvedBuffers.set(name, { version: hit.version, safeFile, buf });
            }
            if (resolvedBuffers.size > 0) {
              let anyChanged = false;
              const vendorDirs = new Set();
              for (const f of files) {
                const pkgDir = path.dirname(f) || ".";
                const p = JSON.parse(fs.readFileSync(f, "utf8"));
                const hasScoped = Object.keys({ ...(p.dependencies || {}), ...(p.devDependencies || {}) }).some(k => resolvedBuffers.has(k));
                if (!hasScoped) continue;
                const vendorDir = path.join(pkgDir, "vendor-tarballs");
                fs.mkdirSync(vendorDir, { recursive: true });
                vendorDirs.add(pkgDir.replace(/\/+$/, "") || ".");
                p.dependencies = p.dependencies || {};
                p.overrides = p.overrides || {};
                for (const [depName, info] of resolvedBuffers.entries()) {
                  fs.writeFileSync(path.join(vendorDir, info.safeFile), info.buf);
                  const localRef = "file:./vendor-tarballs/" + info.safeFile;
                  if (p.dependencies[depName] || (!p.devDependencies?.[depName])) {
                    p.dependencies[depName] = localRef;
                  }
                  if (p.devDependencies && p.devDependencies[depName]) {
                    p.devDependencies[depName] = localRef;
                  }
                  p.overrides[depName] = localRef;
                }
                anyChanged = true;
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
                const lockPath = path.join(pkgDir, "package-lock.json");
                if (fs.existsSync(lockPath)) fs.unlinkSync(lockPath);
                const npmrcPath = path.join(pkgDir, ".npmrc");
                if (fs.existsSync(npmrcPath)) {
                  const cleaned = fs.readFileSync(npmrcPath, "utf8").split("\n").filter(l => !l.includes("gitea.7u.pl")).join("\n");
                  fs.writeFileSync(npmrcPath, cleaned);
                }
                console.log("📦 [wait-for-deps] Zapisano lokalne tarballe @gkucmierz/* w " + vendorDir + " i zaktualizowano " + f);
              }
              if (anyChanged) {
                if (fs.existsSync(".npmrc")) {
                  const cleaned = fs.readFileSync(".npmrc", "utf8").split("\n").filter(l => !l.includes("gitea.7u.pl")).join("\n");
                  fs.writeFileSync(".npmrc", cleaned);
                }
                const subDirsRe = /^(ui|server|crawler|client|app|web)\/package/;
                for (const df of ["Dockerfile", "ui/Dockerfile", "server/Dockerfile", "crawler/Dockerfile", "client/Dockerfile", "app/Dockerfile", "web/Dockerfile"].filter(d => fs.existsSync(d))) {
                  let content = fs.readFileSync(df, "utf8").replace(/\bnpm(\s+(?:--prefix\s+\S+\s+)*)ci\b/g, "npm$1install");
                  if (!content.includes("vendor-tarballs") && vendorDirs.size > 0) {
                    const dfDir = path.posix.dirname(df.replace(/\\/g, "/")) || ".";
                    const outLines = [];
                    for (const line of content.split("\n")) {
                      const m = line.match(/^(\s*COPY\s+(?:--\S+\s+)*)(.+?)\s+(\S+)\s*$/);
                      if (m) {
                        const [, prefix, sourcesStr, rawDest] = m;
                        const tokens = sourcesStr.trim().split(/\s+/);
                        const destVendor = rawDest === "/" ? "/vendor-tarballs/" : ((rawDest.replace(/\/+$/, "") || ".") + "/vendor-tarballs/");
                        let injected = false;
                        for (const tok of tokens) {
                          const sm = tok.match(subDirsRe);
                          if (sm && vendorDirs.has(sm[1])) {
                            outLines.push(prefix + sm[1] + "/vendor-tarballs " + destVendor);
                            injected = true;
                            break;
                          }
                        }
                        if (!injected && tokens.some(tok => /^(?:\.\/)?package/.test(tok)) && vendorDirs.has(dfDir)) {
                          outLines.push(prefix + "vendor-tarballs " + destVendor);
                        }
                      }
                      outLines.push(line);
                    }
                    content = outLines.join("\n");
                  }
                  fs.writeFileSync(df, content);
                }
              }
            }
          })();
          '

      - name: Build and deploy with Docker Compose (Zero-Downtime)
        run: |
          CONTAINER="${{ inputs.container_name }}"
          HOT_SWAP="${{ inputs.hot_swap_static }}"
          node -e '
            const fs = require("fs");
            if (fs.existsSync("docker-compose.yml")) {
              let dc = fs.readFileSync("docker-compose.yml", "utf8");
              dc = dc.replace(/^(\s*)build:\s*\.\s*$/gm, "$1build:\n$1  context: .\n$1  network: host");
              dc = dc.replace(/^(\s*build:\s*\n(?:\s+[^\n]+\n)*?)(\s*dockerfile:\s*[^\n]+)$/gm, (m, p1, p2) => {
                if (m.includes("network:")) return m;
                const indent = (p2.match(/^\s*/) || ["      "])[0];
                return p1 + p2 + "\n" + indent + "network: host";
              });
              fs.writeFileSync("docker-compose.yml", dc);
            }
          '
          docker compose build
          if [ "$HOT_SWAP" = "true" ] && [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
            IMG_NAME=$(docker compose config --images 2>/dev/null | head -n 1)
            IMG_ID=$(docker image inspect -f '{{.Id}}' "$IMG_NAME" 2>/dev/null | head -n 1)
            if [ -n "$IMG_ID" ]; then
              TMP_CID=$(docker create "$IMG_ID")
              TMP_DIR=$(mktemp -d)
              docker cp "$TMP_CID:/usr/share/nginx/html/." "$TMP_DIR/"
              docker cp "$TMP_DIR/." "$CONTAINER:/usr/share/nginx/html/"
              docker cp "$TMP_CID:/etc/nginx/conf.d/default.conf" "$TMP_DIR/default.conf" 2>/dev/null && docker cp "$TMP_DIR/default.conf" "$CONTAINER:/etc/nginx/conf.d/default.conf" 2>/dev/null || true
              rm -rf "$TMP_DIR"
              docker rm -f "$TMP_CID" >/dev/null 2>&1 || true
              docker exec "$CONTAINER" nginx -s reload </dev/null >/dev/null 2>&1
            else
              docker compose up -d --remove-orphans
            fi
          else
            docker compose up -d --remove-orphans
          fi
          for npm_cid in $(docker ps -q --filter "ancestor=jc21/nginx-proxy-manager" --filter "status=running"); do
            docker exec "$npm_cid" nginx -s reload </dev/null >/dev/null 2>&1 || true
          done

      - name: Post-Deploy Auto Smoke Test (Internal Container Probe & Homepage)
        run: |
          URL="${{ inputs.healthcheck_url }}"
          if [ -z "$URL" ] && [ -f package.json ]; then
            URL=$(node -e 'try { const p = JSON.parse(require("fs").readFileSync("package.json","utf8")); if (p.homepage && p.homepage.startsWith("http")) console.log(p.homepage); } catch {}' 2>/dev/null || echo "")
          fi
          CONTAINER="${{ inputs.container_name }}"
          echo "🔍 Smoke-testing container: $CONTAINER ${URL:+(url: $URL)} ..."
          for i in 1 2 3 4 5; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
              if docker exec "$CONTAINER" wget -q -O /dev/null http://127.0.0.1:80/ 2>/dev/null; then
                echo "✅ Smoke test passed via internal container probe ($CONTAINER -> 127.0.0.1:80 HTTP 200)"
                exit 0
              fi
            fi
            if [ -n "$URL" ]; then
              STATUS=$(node -e "fetch(process.argv[1]).then(r => console.log(r.status)).catch(() => console.log('000'))" "$URL" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
                echo "✅ Smoke test passed ($URL -> HTTP $STATUS)"
                exit 0
              fi
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ] && [ -z "$URL" ]; then
              echo "✅ Container $CONTAINER is running"
              exit 0
            fi
            echo "⏳ Attempt $i/5 waiting for $CONTAINER readiness, retrying in 2s..."
            sleep 2
          done
          echo "❌ Smoke test failed for $CONTAINER"
          docker logs "$CONTAINER" --tail 40 || true
          exit 1

      - name: Sync Gitea Repository Website & Description Metadata
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || gitea.token }}
          HC_URL: ${{ inputs.healthcheck_url }}
        run: |
          node -e '
          const fs = require("fs");
          const token = process.env.REPO_TOKEN || "";
          const repoSlug = process.env.GITHUB_REPOSITORY || "";
          if (!token || !repoSlug) process.exit(0);
          let pkg = {};
          try { pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); } catch {}
          const hcUrl = process.env.HC_URL || "";
          const website = pkg.homepage || (hcUrl.startsWith("https://") ? hcUrl.replace(/\/+$/, "") : "");
          const description = (pkg.description || "").trim();
          if (!website && !description) process.exit(0);
          const body = {};
          if (website) body.website = website;
          if (description) body.description = description;
          fetch("https://gitea.7u.pl/api/v1/repos/" + repoSlug, {
            method: "PATCH",
            headers: {
              "Authorization": "token " + token,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          }).then(r => console.log("🔗 [Gitea Repo Metadata] PATCH /repos/" + repoSlug + " -> HTTP " + r.status)).catch(() => {});
          '
