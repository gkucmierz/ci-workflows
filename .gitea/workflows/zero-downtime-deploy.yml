name: Reusable Zero-Downtime Build & Deploy (with Dependency Readiness Gate)

on:
  workflow_call:
    inputs:
      container_name:
        description: 'Nazwa kontenera Docker (np. my-web-app)'
        required: true
        type: string
      runs_on:
        description: 'Etykieta runnera Gitea (self-hosted-pl lub self-hosted-de)'
        required: false
        type: string
        default: 'self-hosted-pl'
      hot_swap_static:
        description: 'Atomowy hot-swap statycznych plików Nginx (true dla SPA/VitePress, false dla backendów Node)'
        required: false
        type: boolean
        default: true
      wait_timeout_sec:
        description: 'Limit czasu oczekiwania na publikację zależności wewnętrznych w NPM (s)'
        required: false
        type: number
        default: 180
      healthcheck_url:
        description: 'Opcjonalny publiczny lub lokalny URL smoke-testu HTTP po wdrożeniu (np. https://app.example.com/ lub http://localhost:3000/)'
        required: false
        type: string
        default: ''
      require_external_healthcheck:
        description: 'Czy niepowodzenie zewnętrznego healthcheck_url (np. 502/525/5xx) przerywa pipeline błędem (domyślnie true)'
        required: false
        type: boolean
        default: true
      healthcheck_retries:
        description: 'Maksymalna liczba prób odpytania zewnętrznego healthcheck_url (domyślnie 8)'
        required: false
        type: number
        default: 8
      expected_status:
        description: 'Akceptowane kody HTTP zewnętrznego healthchecku (CSV, domyślnie 200,204,301,302,307,308)'
        required: false
        type: string
        default: '200,204,301,302,307,308'
      gitea_owner:
        description: 'Właściciel lub organizacja w Gitea / GitHub (domyślnie wykrywany z kontekstu repozytorium)'
        required: false
        type: string
        default: ''
      package_scope:
        description: 'Prefiks scope paczek wewnętrznych NPM, np. @acme/ (domyślnie wykrywany dynamicznie)'
        required: false
        type: string
        default: ''
      private_registry_url:
        description: 'URL prywatnego rejestru NPM (domyślnie wyliczany dynamicznie z kontekstu serwera i właściciela)'
        required: false
        type: string
        default: ''
      internal_packages:
        description: 'Opcjonalna lista dodatkowych paczek wewnętrznych (CSV)'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy (${{ inputs.container_name }})
    runs-on: self-hosted-pl
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Wait for internal dependencies (NPM & Private Registry)
        env:
          WAIT_FOR_DEPS_TIMEOUT_SEC: ${{ inputs.wait_timeout_sec }}
          GITEA_PKG_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || github.token }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPO_FULL: ${{ github.repository }}
          GITEA_OWNER_INPUT: ${{ inputs.gitea_owner }}
          PACKAGE_SCOPE_INPUT: ${{ inputs.package_scope }}
          PRIVATE_REGISTRY_INPUT: ${{ inputs.private_registry_url }}
          INTERNAL_PACKAGES_INPUT: ${{ inputs.internal_packages }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");
          const giteaToken = process.env.GITEA_PKG_TOKEN || "";
          const files = ["package.json", "ui/package.json", "server/package.json", "crawler/package.json", "client/package.json", "app/package.json", "web/package.json"].filter(f => fs.existsSync(f));
          const npmrcFiles = [".npmrc", "ui/.npmrc", "server/.npmrc", "crawler/.npmrc", "client/.npmrc", "app/.npmrc", "web/.npmrc"].filter(f => fs.existsSync(f));
          let npmrcScope = "";
          let npmrcRegistry = "";
          for (const nf of npmrcFiles) {
            for (const line of fs.readFileSync(nf, "utf8").split("\n")) {
              const t = line.trim();
              if (!t || t.startsWith("#") || t.startsWith(";")) continue;
              const sm = t.match(/^(@[^:=\s]+):registry\s*=\s*(\S+)/);
              if (sm) {
                if (!npmrcScope) npmrcScope = sm[1];
                if (!npmrcRegistry && !sm[2].includes("registry.npmjs.org")) npmrcRegistry = sm[2];
                continue;
              }
              const pm = t.match(/^registry\s*=\s*(\S+)/);
              if (pm && !pm[1].includes("registry.npmjs.org") && !npmrcRegistry) npmrcRegistry = pm[1];
            }
          }
          let pkgScopeOwner = "";
          for (const f of files) {
            try {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              if (p.name && String(p.name).startsWith("@") && String(p.name).includes("/")) {
                pkgScopeOwner = String(p.name).slice(1).split("/")[0];
                break;
              }
            } catch {}
          }
          const safeOrigin = (u) => { try { return u ? new URL(String(u).trim()).origin : ""; } catch { return ""; } };
          const safeHost = (u) => { try { return u ? new URL(String(u).trim()).host.toLowerCase() : ""; } catch { return ""; } };
          const normalizeScope = (s) => {
            const t = String(s || "").trim();
            if (!t) return "";
            const a = t.startsWith("@") ? t : "@" + t;
            return a.endsWith("/") ? a : a + "/";
          };
          const npmrcOwnerMatch = npmrcRegistry.match(/\/api\/packages\/([^/]+)\/npm/i);
          const npmrcOwner = npmrcOwnerMatch ? decodeURIComponent(npmrcOwnerMatch[1]) : "";
          const repoFull = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
          const repoSlugOwner = repoFull.includes("/") ? repoFull.split("/")[0].trim() : "";
          const repoOwner = String(
            process.env.GITEA_OWNER_INPUT ||
            process.env.GITHUB_REPOSITORY_OWNER ||
            repoSlugOwner ||
            npmrcOwner ||
            pkgScopeOwner ||
            ""
          ).trim();
          const scopePrefix =
            normalizeScope(process.env.PACKAGE_SCOPE_INPUT) ||
            normalizeScope(npmrcScope) ||
            (repoOwner ? "@" + repoOwner + "/" : "") ||
            (pkgScopeOwner ? "@" + pkgScopeOwner + "/" : "");
          const serverOrigin =
            safeOrigin(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL) ||
            safeOrigin(process.env.PRIVATE_REGISTRY_INPUT) ||
            safeOrigin(npmrcRegistry);
          const apiBase = (
            String(process.env.GITEA_API_URL || process.env.GITHUB_API_URL || "").trim() ||
            (serverOrigin ? serverOrigin + "/api/v1" : "")
          ).replace(/\/+$/, "");
          const internalApiBase = serverOrigin && !serverOrigin.includes("github.com") ? "http://gitea:3000/api/v1" : "";
          const apiBases = Array.from(new Set([internalApiBase, apiBase].filter(Boolean)));
          const rawPrivReg =
            String(process.env.PRIVATE_REGISTRY_INPUT || "").trim() ||
            npmrcRegistry ||
            (serverOrigin && repoOwner && !serverOrigin.includes("github.com")
              ? serverOrigin + "/api/packages/" + encodeURIComponent(repoOwner) + "/npm/"
              : "");
          const privateRegUrl = rawPrivReg ? rawPrivReg.replace(/\/+$/, "") + "/" : "";
          const internalBridgeRegUrl = privateRegUrl.includes("/api/packages/")
            ? privateRegUrl.replace(/^https?:\/\/[^/]+\//, "http://gitea:3000/")
            : "";
          const privateHosts = new Set(
            [safeHost(serverOrigin), safeHost(privateRegUrl), safeHost(apiBase), "gitea:3000"].filter(
              h => h && h !== "registry.npmjs.org" && h !== "registry.yarnpkg.com" && h !== "github.com" && h !== "api.github.com"
            )
          );
          const isPrivateHostUrl = (s) => {
            const str = String(s || "");
            if (!str || str.includes("registry.npmjs.org")) return false;
            if (str.includes("/api/packages/") || str.includes("gitea:3000")) return true;
            const lower = str.toLowerCase();
            for (const h of privateHosts) {
              if (lower.includes(h)) return true;
            }
            return false;
          };
          const cmp = (a, b) => {
            const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
            for (let i = 0; i < 3; i++) if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
            return 0;
          };
          const extractMinVer = (verSpec) => {
            const s = String(verSpec || "");
            const urlMatch = s.match(/\/-\/(\d+\.\d+\.\d+)(?:\/|$)/) || s.match(/-(\d+\.\d+\.\d+)\.tgz/);
            if (urlMatch) return urlMatch[1];
            return s.replace(/^[^\d]*/, "").split("-")[0] || "0.0.0";
          };
          const buildHeaders = (url) => {
            const h = { "Cache-Control": "no-cache" };
            if (giteaToken && isPrivateHostUrl(url)) {
              h["Authorization"] = "token " + giteaToken;
            }
            return h;
          };
          const rewriteInternalGiteaUrl = (url) => {
            if (!url || !isPrivateHostUrl(url)) return url;
            return String(url).replace(/^https?:\/\/[^/]+\//, "http://gitea:3000/");
          };
          const ownedPackages = new Set(
            String(process.env.INTERNAL_PACKAGES_INPUT || "").split(",").map(s => s.trim()).filter(Boolean)
          );
          const checkedUnscoped = new Map();
          const discoverOwnedPackages = async () => {
            if (!repoOwner || apiBases.length === 0) return;
            for (const base of apiBases) {
              let okBase = false;
              for (let page = 1; page <= 5; page++) {
                try {
                  const u = `${base}/packages/${encodeURIComponent(repoOwner)}?type=npm&limit=100&page=${page}`;
                  const r = await fetch(u, { headers: buildHeaders(u) });
                  if (!r.ok) break;
                  okBase = true;
                  const arr = await r.json();
                  if (!Array.isArray(arr) || arr.length === 0) break;
                  for (const p of arr) if (p && p.name) ownedPackages.add(String(p.name));
                } catch { break; }
              }
              if (okBase) break;
            }
          };
          const checkUnscopedOwnedRepo = async (depName) => {
            if (!depName || depName.startsWith("@")) return false;
            if (ownedPackages.has(depName)) return true;
            if (checkedUnscoped.has(depName)) return checkedUnscoped.get(depName);
            if (!repoOwner || apiBases.length === 0) {
              checkedUnscoped.set(depName, false);
              return false;
            }
            for (const base of apiBases) {
              try {
                const u = `${base}/repos/${encodeURIComponent(repoOwner)}/${encodeURIComponent(depName)}`;
                const r = await fetch(u, { headers: buildHeaders(u) });
                if (r.status === 200) {
                  const data = await r.json();
                  const owned = Boolean(
                    data && data.fork === false && String(data.owner?.login || "").toLowerCase() === repoOwner.toLowerCase()
                  );
                  if (owned) ownedPackages.add(depName);
                  checkedUnscoped.set(depName, owned);
                  return owned;
                }
                checkedUnscoped.set(depName, false);
                return false;
              } catch {}
            }
            checkedUnscoped.set(depName, false);
            return false;
          };
          const isInternalDep = async (name, verSpec) => {
            if (!name) return false;
            if (scopePrefix && name.startsWith(scopePrefix)) return true;
            if (ownedPackages.has(name)) return true;
            if (isPrivateHostUrl(verSpec)) return true;
            if (!name.startsWith("@")) return await checkUnscopedOwnedRepo(name);
            return false;
          };
          const queryReg = async (baseUrl, name, minVer) => {
            try {
              const url = baseUrl + name.replace("/", "%2f") + "?t=" + Date.now();
              const res = await fetch(url, { headers: buildHeaders(url) });
              if (!res.ok) return null;
              const data = await res.json();
              const vers = Object.keys(data.versions || {}).filter(v => cmp(v, minVer) >= 0).sort(cmp);
              if (vers.length === 0) return null;
              const latest = vers[vers.length - 1];
              const tarball = data.versions?.[latest]?.dist?.tarball || null;
              return { version: latest, tarball };
            } catch {
              return null;
            }
          };
          const autoHealDispatched = new Set();
          const triggerUpstreamSelfHeal = async (pkgName, minVer) => {
            if (autoHealDispatched.has(pkgName) || !giteaToken || !repoOwner || apiBases.length === 0) return;
            autoHealDispatched.add(pkgName);
            const repoName = scopePrefix && pkgName.startsWith(scopePrefix)
              ? pkgName.slice(scopePrefix.length)
              : pkgName.replace(/^@[^/]+\//, "");
            for (const base of apiBases) {
              for (const wf of ["publish.yml", "publish.yaml", "build.yml", "build.yaml", "deploy.yml", "deploy.yaml"]) {
                try {
                  const res = await fetch(`${base}/repos/${encodeURIComponent(repoOwner)}/${encodeURIComponent(repoName)}/actions/workflows/${wf}/dispatches`, {
                    method: "POST",
                    headers: {
                      "Authorization": "token " + giteaToken,
                      "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ ref: "main" })
                  });
                  if (res.status === 204 || res.status === 200 || res.status === 201) {
                    console.log(`🩺 [self-heal] Auto-triggered workflow ${wf} for ${repoOwner}/${repoName} (waiting for ${pkgName}>=${minVer})`);
                    return;
                  }
                } catch {}
              }
            }
          };
          (async () => {
            const selfNames = new Set();
            const rawAllEntries = [];
            for (const f of files) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              if (p.name) selfNames.add(p.name);
              for (const [k, v] of Object.entries({ ...(p.dependencies || {}), ...(p.devDependencies || {}) })) {
                rawAllEntries.push([k, v]);
              }
            }
            if (rawAllEntries.length > 0) {
              await discoverOwnedPackages();
              const unscopedCandidates = Array.from(new Set(rawAllEntries.map(([k]) => k).filter(k => !k.startsWith("@") && !ownedPackages.has(k))));
              if (unscopedCandidates.length > 0) {
                await Promise.all(unscopedCandidates.map(k => checkUnscopedOwnedRepo(k)));
              }
            }
            const deps = new Map();
            for (const [k, v] of rawAllEntries) {
              if ((await isInternalDep(k, v)) && !String(v).startsWith("file:")) {
                const ver = extractMinVer(v);
                if (!deps.has(k) || cmp(ver, deps.get(k)) > 0) {
                  deps.set(k, ver);
                }
              }
            }
            for (const s of selfNames) deps.delete(s);
            const deadline = Date.now() + (Number(process.env.WAIT_FOR_DEPS_TIMEOUT_SEC || 180) * 1000);
            const resolvedBuffers = new Map();
            const queue = Array.from(deps.entries());
            while (queue.length > 0) {
              const [name, minVer] = queue.shift();
              if (resolvedBuffers.has(name) && cmp(resolvedBuffers.get(name).version, minVer) >= 0) continue;
              let hit = null;
              while (true) {
                const [internalGiteaHit, giteaHit, npmHit] = await Promise.all([
                  internalBridgeRegUrl && internalBridgeRegUrl !== privateRegUrl
                    ? queryReg(internalBridgeRegUrl, name, minVer)
                    : Promise.resolve(null),
                  privateRegUrl ? queryReg(privateRegUrl, name, minVer) : Promise.resolve(null),
                  queryReg("https://registry.npmjs.org/", name, minVer)
                ]);
                const candidates = [
                  internalGiteaHit && internalGiteaHit.tarball
                    ? { ...internalGiteaHit, tarball: rewriteInternalGiteaUrl(internalGiteaHit.tarball), label: "Gitea Internal", prio: 3 }
                    : null,
                  giteaHit && giteaHit.tarball
                    ? { ...giteaHit, label: "Gitea Packages", prio: 2 }
                    : null,
                  npmHit && npmHit.tarball
                    ? { ...npmHit, label: "npmjs", prio: 1 }
                    : null
                ].filter(Boolean);
                if (candidates.length > 0) {
                  candidates.sort((a, b) => {
                    const vDiff = cmp(b.version, a.version);
                    return vDiff !== 0 ? vDiff : b.prio - a.prio;
                  });
                  hit = candidates[0];
                  console.log("✅ [wait-for-deps] " + name + " >= " + minVer + " dostępny w " + hit.label + " (" + hit.version + ")");
                  break;
                }
                await triggerUpstreamSelfHeal(name, minVer);
                if (Date.now() >= deadline) {
                  console.error("❌ [wait-for-deps] Timeout oczekiwania na " + name + ">=" + minVer + " (npmjs + Gitea Packages)");
                  process.exit(1);
                }
                console.log("⏳ [wait-for-deps] Czekam 5s na publikację " + name + ">=" + minVer + " (Gitea Packages / npmjs)...");
                await new Promise(r => setTimeout(r, 5000));
              }
              let tRes = await fetch(hit.tarball, { headers: buildHeaders(hit.tarball) }).catch(() => null);
              if ((!tRes || !tRes.ok) && isPrivateHostUrl(hit.tarball) && !String(hit.tarball).startsWith("http://gitea:3000/")) {
                const altUrl = rewriteInternalGiteaUrl(hit.tarball);
                tRes = await fetch(altUrl, { headers: buildHeaders(altUrl) }).catch(() => null);
              }
              if (!tRes || !tRes.ok) {
                console.error("❌ [wait-for-deps] Nie udało się pobrać tarballa " + hit.tarball + " (HTTP " + (tRes ? tRes.status : "ERR") + ")");
                process.exit(1);
              }
              let buf = Buffer.from(await tRes.arrayBuffer());
              const safeFile = name.replace(/^@/, "").replace(/\//g, "-") + ".tgz";
              try {
                const tmpTgz = path.join("/tmp", safeFile);
                fs.writeFileSync(tmpTgz, buf);
                const innerPkgRaw = execFileSync("tar", ["-xzOf", tmpTgz, "package/package.json"], { encoding: "utf8" });
                const innerPkg = JSON.parse(innerPkgRaw);
                let innerModified = false;
                for (const [tk, tv] of Object.entries(innerPkg.dependencies || {})) {
                  if ((await isInternalDep(tk, tv)) && !selfNames.has(tk)) {
                    const tVer = extractMinVer(tv);
                    if (!resolvedBuffers.has(tk) || cmp(tVer, resolvedBuffers.get(tk).version) > 0) {
                      queue.push([tk, tVer]);
                    }
                    if (isPrivateHostUrl(tv)) {
                      innerPkg.dependencies[tk] = "^" + (tVer === "0.0.0" ? "1.0.0" : tVer);
                      innerModified = true;
                    }
                  }
                }
                if (innerModified) {
                  const repackDir = path.join("/tmp", "repack-" + Date.now() + "-" + Math.random().toString(36).slice(2));
                  fs.mkdirSync(repackDir, { recursive: true });
                  execFileSync("tar", ["-xzf", tmpTgz, "-C", repackDir]);
                  fs.writeFileSync(path.join(repackDir, "package", "package.json"), JSON.stringify(innerPkg, null, 2) + "\n");
                  execFileSync("tar", ["-czf", tmpTgz, "-C", repackDir, "package"]);
                  buf = fs.readFileSync(tmpTgz);
                  fs.rmSync(repackDir, { recursive: true, force: true });
                }
                fs.unlinkSync(tmpTgz);
              } catch {}
              resolvedBuffers.set(name, { version: hit.version, safeFile, buf });
            }
            if (resolvedBuffers.size > 0) {
              let anyChanged = false;
              const vendorDirs = new Set();
              for (const f of files) {
                const pkgDir = path.dirname(f) || ".";
                const p = JSON.parse(fs.readFileSync(f, "utf8"));
                const hasScoped = Object.keys({ ...(p.dependencies || {}), ...(p.devDependencies || {}) }).some(k => resolvedBuffers.has(k));
                if (!hasScoped) continue;
                const vendorDir = path.join(pkgDir, "vendor-tarballs");
                fs.mkdirSync(vendorDir, { recursive: true });
                vendorDirs.add(pkgDir.replace(/\/+$/, "") || ".");
                const hadDeps = Boolean(p.dependencies);
                p.dependencies = p.dependencies || {};
                p.overrides = p.overrides || {};
                for (const [depName, info] of resolvedBuffers.entries()) {
                  fs.writeFileSync(path.join(vendorDir, info.safeFile), info.buf);
                  const localRef = "file:./vendor-tarballs/" + info.safeFile;
                  if (p.dependencies[depName] || (!p.devDependencies?.[depName])) {
                    p.dependencies[depName] = localRef;
                  }
                  if (p.devDependencies && p.devDependencies[depName]) {
                    p.devDependencies[depName] = localRef;
                  }
                  p.overrides[depName] = localRef;
                }
                if (!hadDeps && Object.keys(p.dependencies).length === 0) {
                  delete p.dependencies;
                }
                anyChanged = true;
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
                const lockPath = path.join(pkgDir, "package-lock.json");
                if (fs.existsSync(lockPath)) fs.unlinkSync(lockPath);
                const npmrcPath = path.join(pkgDir, ".npmrc");
                if (fs.existsSync(npmrcPath)) {
                  const cleaned = fs.readFileSync(npmrcPath, "utf8").split("\n").filter(l => !isPrivateHostUrl(l)).join("\n");
                  fs.writeFileSync(npmrcPath, cleaned);
                }
                console.log("📦 [wait-for-deps] Zapisano lokalne tarballe zależności wewnętrznych w " + vendorDir + " i zaktualizowano " + f);
              }
              if (anyChanged) {
                if (fs.existsSync(".npmrc")) {
                  const cleaned = fs.readFileSync(".npmrc", "utf8").split("\n").filter(l => !isPrivateHostUrl(l)).join("\n");
                  fs.writeFileSync(".npmrc", cleaned);
                }
                const subDirsRe = /^(ui|server|crawler|client|app|web)\/package/;
                for (const df of ["Dockerfile", "ui/Dockerfile", "server/Dockerfile", "crawler/Dockerfile", "client/Dockerfile", "app/Dockerfile", "web/Dockerfile"].filter(d => fs.existsSync(d))) {
                  let content = fs.readFileSync(df, "utf8").replace(/\bnpm(\s+(?:--prefix\s+\S+\s+)*)ci\b/g, "npm$1install");
                  if (!content.includes("vendor-tarballs") && vendorDirs.size > 0) {
                    const dfDir = path.posix.dirname(df.replace(/\\/g, "/")) || ".";
                    const outLines = [];
                    for (const line of content.split("\n")) {
                      const m = line.match(/^(\s*COPY\s+(?:--\S+\s+)*)(.+?)\s+(\S+)\s*$/);
                      if (m) {
                        const [, prefix, sourcesStr, rawDest] = m;
                        const tokens = sourcesStr.trim().split(/\s+/);
                        const destVendor = rawDest === "/" ? "/vendor-tarballs/" : ((rawDest.replace(/\/+$/, "") || ".") + "/vendor-tarballs/");
                        let injected = false;
                        for (const tok of tokens) {
                          const sm = tok.match(subDirsRe);
                          if (sm && vendorDirs.has(sm[1])) {
                            outLines.push(prefix + sm[1] + "/vendor-tarballs " + destVendor);
                            injected = true;
                            break;
                          }
                        }
                        if (!injected && tokens.some(tok => /^(?:\.\/)?package/.test(tok)) && vendorDirs.has(dfDir)) {
                          outLines.push(prefix + "vendor-tarballs " + destVendor);
                        }
                      }
                      outLines.push(line);
                    }
                    content = outLines.join("\n");
                  }
                  fs.writeFileSync(df, content);
                }
              }
            }
          })();
          '

      - name: Build and deploy with Docker Compose (Zero-Downtime)
        run: |
          CONTAINER="${{ inputs.container_name }}"
          HOT_SWAP="${{ inputs.hot_swap_static }}"
          node -e '
            const fs = require("fs");
            if (fs.existsSync("docker-compose.yml")) {
              const raw = fs.readFileSync("docker-compose.yml", "utf8");
              const eol = raw.includes("\r\n") ? "\r\n" : "\n";
              const lines = raw.split(/\r?\n/);
              const out = [];
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const sm = line.match(/^([ \t]*)build:[ \t]+([^#\s][^\r\n]*?)[ \t]*(?:#.*)?$/);
                if (sm) {
                  out.push(sm[1] + "build:", sm[1] + "  context: " + sm[2], sm[1] + "  network: host");
                  continue;
                }
                const bm = line.match(/^([ \t]*)build:[ \t]*(?:#.*)?$/);
                if (bm) {
                  const baseLen = bm[1].length;
                  let childIndent = null, hasNetwork = false, lastChild = -1, j = i + 1;
                  while (j < lines.length) {
                    const cur = lines[j], trimmed = cur.trim();
                    if (!trimmed || trimmed.startsWith("#")) { j++; continue; }
                    const curIndent = cur.match(/^[ \t]*/)[0];
                    if (curIndent.length <= baseLen) break;
                    if (childIndent === null) childIndent = curIndent;
                    if (curIndent.length === childIndent.length && /^network:[ \t]*/.test(trimmed)) hasNetwork = true;
                    lastChild = j;
                    j++;
                  }
                  if (!hasNetwork && lastChild >= 0) {
                    for (let k = i; k <= lastChild; k++) out.push(lines[k]);
                    out.push(childIndent + "network: host");
                    for (let k = lastChild + 1; k < j; k++) out.push(lines[k]);
                  } else {
                    for (let k = i; k < j; k++) out.push(lines[k]);
                  }
                  i = j - 1;
                  continue;
                }
                out.push(line);
              }
              fs.writeFileSync("docker-compose.yml", out.join(eol));
            }
          '
          REQUESTED_RUNNER="${{ inputs.runs_on || 'self-hosted-pl' }}"
          echo "🏃 Active runner: ${RUNNER_NAME:-unknown} (container: $CONTAINER, pinned: self-hosted-pl, requested runs_on: $REQUESTED_RUNNER)"
          if [ -n "$REQUESTED_RUNNER" ] && [ "$REQUESTED_RUNNER" != "self-hosted-pl" ] && [ "$REQUESTED_RUNNER" != "self-hosted" ]; then
            echo "❌ Reusable zero-downtime-deploy.yml is statically pinned to 'self-hosted-pl' (Gitea workflow_call drops dynamic runs-on expressions). For '$REQUESTED_RUNNER', invoke composite actions wait-for-deps@main + zero-downtime-swap@main directly under a static 'runs-on: $REQUESTED_RUNNER' job."
            exit 1
          fi
          BUILDKIT_PROGRESS=plain docker compose build
          if [ "$HOT_SWAP" = "true" ] && [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
            IMG_NAME=$(docker compose config --images 2>/dev/null | head -n 1)
            IMG_ID=$(docker image inspect -f '{{.Id}}' "$IMG_NAME" 2>/dev/null | head -n 1)
            if [ -n "$IMG_ID" ]; then
              TMP_CID=$(docker create "$IMG_ID")
              TMP_DIR=$(mktemp -d)
              docker cp "$TMP_CID:/usr/share/nginx/html/." "$TMP_DIR/"
              docker cp "$TMP_DIR/." "$CONTAINER:/usr/share/nginx/html/"
              docker cp "$TMP_CID:/etc/nginx/conf.d/default.conf" "$TMP_DIR/default.conf" 2>/dev/null && docker cp "$TMP_DIR/default.conf" "$CONTAINER:/etc/nginx/conf.d/default.conf" 2>/dev/null || true
              rm -rf "$TMP_DIR"
              docker rm -f "$TMP_CID" >/dev/null 2>&1 || true
              docker exec "$CONTAINER" nginx -s reload </dev/null >/dev/null 2>&1
            else
              docker compose up -d --remove-orphans
            fi
          else
            docker compose up -d --remove-orphans
          fi
          for npm_cid in $(docker ps -q --filter "ancestor=jc21/nginx-proxy-manager" --filter "status=running"); do
            docker exec "$npm_cid" nginx -s reload </dev/null >/dev/null 2>&1 || true
          done

      - name: Post-Deploy Dual-Layer Smoke Test (Internal Container + External URL)
        env:
          HC_CONTAINER: ${{ inputs.container_name }}
          HC_URL: ${{ inputs.healthcheck_url }}
          HC_REQUIRE_EXTERNAL: ${{ inputs.require_external_healthcheck }}
          HC_RETRIES: ${{ inputs.healthcheck_retries }}
          HC_EXPECTED_STATUS: ${{ inputs.expected_status }}
        run: |
          node -e '
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const container = String(process.env.HC_CONTAINER || "").trim();
          const runnerName = String(process.env.RUNNER_NAME || "").trim();
          const requireExt = String(process.env.HC_REQUIRE_EXTERNAL ?? "true").trim().toLowerCase() !== "false";
          const retries = Math.max(1, Math.min(30, Number(process.env.HC_RETRIES || 8)));
          const allowed = new Set(
            String(process.env.HC_EXPECTED_STATUS || "200,204,301,302,307,308")
              .split(/[,\s]+/)
              .map(Number)
              .filter((n) => Number.isInteger(n) && n >= 100 && n <= 599)
          );
          let url = String(process.env.HC_URL || "").trim();
          if (!url && fs.existsSync("package.json")) {
            try {
              const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
              if (p.homepage && /^https?:\/\//i.test(String(p.homepage))) url = String(p.homepage).trim();
            } catch {}
          }
          const isRunning = () => {
            try {
              return execFileSync("docker", ["inspect", "-f", "{{.State.Running}}", container], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).trim() === "true";
            } catch { return false; }
          };
          const probeInternal = () => {
            try {
              execFileSync("docker", ["exec", container, "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:80/ 2>/dev/null || curl -fsS -o /dev/null http://127.0.0.1:80/ 2>/dev/null"], { stdio: "ignore", timeout: 5000 });
              return true;
            } catch { return false; }
          };
          const printLogs = () => {
            try {
              const out = execFileSync("docker", ["logs", container, "--tail", "40"], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
              if (out.trim()) console.error("--- docker logs " + container + " ---\n" + out.trim());
            } catch {}
          };
          const diagnose = (status, err) => {
            if (status === 502 || status === 503 || status === 504) {
              return "HTTP " + status + " on " + url + ": upstream gateway unreachable — verify reverse proxy hostname/port, shared Docker bridge network, and that the job ran on the intended target runner (static runs-on label).";
            }
            if (status === 525 || status === 526) {
              return "HTTP " + status + " on " + url + ": TLS/SSL handshake or certificate validation failed at reverse proxy.";
            }
            if (status >= 520 && status <= 524) {
              return "HTTP " + status + " on " + url + ": edge proxy could not reach origin host — verify DNS target and firewall.";
            }
            if (status > 0) return "HTTP " + status + " on " + url + ": unexpected non-healthy HTTP status.";
            return "Network/TLS error probing " + url + ": " + (err || "connection failed");
          };
          (async () => {
            console.log("🔍 Dual-layer smoke test for \"" + container + "\"" + (runnerName ? " on runner \"" + runnerName + "\"" : "") + (url ? " (external: " + url + ", requireExternal=" + requireExt + ")" : " (no external URL)") + "...");
            let running = false;
            let internalOk = false;
            const p1Max = Math.min(retries, 5);
            for (let i = 1; i <= p1Max; i++) {
              running = isRunning();
              if (running) {
                internalOk = probeInternal();
                if (internalOk || url) break;
              }
              if (i < p1Max) {
                console.log("⏳ Waiting for container \"" + container + "\" readiness (" + i + "/" + p1Max + ")...");
                await sleep(2000);
              }
            }
            if (!running) {
              console.error("❌ Container \"" + container + "\" is not running after deploy.");
              printLogs();
              process.exit(1);
            }
            console.log(internalOk ? "✅ Phase 1 passed: container \"" + container + "\" running & 127.0.0.1:80 HTTP 200." : "ℹ️ Phase 1: container \"" + container + "\" is running.");
            if (!url) {
              console.log("✅ Smoke test passed (no external healthcheck_url configured).");
              process.exit(0);
            }
            let lastStatus = 0;
            let lastErr = "";
            for (let i = 1; i <= retries; i++) {
              lastStatus = 0;
              lastErr = "";
              try {
                const res = await fetch(url, {
                  method: "GET",
                  redirect: "manual",
                  headers: { "Cache-Control": "no-cache, no-store", Pragma: "no-cache", "User-Agent": "ci-workflows-healthcheck/1.0" },
                  signal: AbortSignal.timeout(10000)
                });
                lastStatus = Number(res.status) || 0;
                if (allowed.has(lastStatus)) {
                  console.log("✅ Phase 2 passed: external " + url + " -> HTTP " + lastStatus + " (attempt " + i + "/" + retries + ").");
                  process.exit(0);
                }
              } catch (e) {
                lastErr = e?.cause?.code || e?.cause?.message || e?.message || String(e);
              }
              if (i < retries) {
                console.log("⏳ External probe " + i + "/" + retries + " for " + url + " returned " + (lastStatus > 0 ? "HTTP " + lastStatus : lastErr) + "; retrying in 2s...");
                await sleep(2000);
              }
            }
            const msg = diagnose(lastStatus, lastErr);
            if (!requireExt) {
              console.warn("⚠️ External healthcheck warning (non-blocking): " + msg);
              process.exit(0);
            }
            console.error("❌ Dual-layer smoke test FAILED — container \"" + container + "\" is running locally, but external check failed: " + msg);
            printLogs();
            process.exit(1);
          })();
          '

      - name: Sync Gitea Repository Website & Description Metadata
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || github.token }}
          HC_URL: ${{ inputs.healthcheck_url }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPO_FULL: ${{ github.repository }}
        run: |
          node -e '
          const fs = require("fs");
          const token = process.env.REPO_TOKEN || "";
          const repoSlug = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
          let srv = "";
          try { srv = new URL(String(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL || "").trim()).origin; } catch {}
          const apiBase = (String(process.env.GITEA_API_URL || process.env.GITHUB_API_URL || "").trim() || (srv ? srv + "/api/v1" : "")).replace(/\/+$/, "");
          if (!token || !repoSlug || !apiBase || apiBase.includes("api.github.com")) process.exit(0);
          let pkg = {};
          try { pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); } catch {}
          const hcUrl = process.env.HC_URL || "";
          const website = pkg.homepage || (hcUrl.startsWith("https://") ? hcUrl.replace(/\/+$/, "") : "");
          const description = (pkg.description || "").trim();
          if (!website && !description) process.exit(0);
          const body = {};
          if (website) body.website = website;
          if (description) body.description = description;
          fetch(apiBase + "/repos/" + repoSlug, {
            method: "PATCH",
            headers: {
              "Authorization": "token " + token,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          }).then(r => console.log("🔗 [Gitea Repo Metadata] PATCH /repos/" + repoSlug + " -> HTTP " + r.status)).catch(() => {});
          '
