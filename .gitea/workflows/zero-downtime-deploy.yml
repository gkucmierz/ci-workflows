name: Reusable Zero-Downtime Build & Deploy (with Dependency Readiness Gate)

on:
  workflow_call:
    inputs:
      container_name:
        description: 'Nazwa kontenera Docker (np. science-blog)'
        required: true
        type: string
      runs_on:
        description: 'Etykieta runnera Gitea (self-hosted-pl lub self-hosted-de)'
        required: false
        type: string
        default: 'self-hosted-pl'
      hot_swap_static:
        description: 'Atomowy hot-swap statycznych plików Nginx (true dla SPA/VitePress, false dla backendów Node)'
        required: false
        type: boolean
        default: true
      wait_timeout_sec:
        description: 'Limit czasu oczekiwania na publikację zależności @gkucmierz/* w NPM (s)'
        required: false
        type: number
        default: 180
      healthcheck_url:
        description: 'Opcjonalny URL lokalnego smoke-testu HTTP po wdrożeniu (np. http://localhost:6162/)'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy (${{ inputs.container_name }})
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Wait for @gkucmierz/* dependencies (NPM & Gitea Packages)
        env:
          WAIT_FOR_DEPS_TIMEOUT_SEC: ${{ inputs.wait_timeout_sec }}
        run: |
          node -e '
          const fs = require("fs");
          const files = ["package.json", "ui/package.json", "server/package.json", "crawler/package.json", "client/package.json", "app/package.json", "web/package.json"].filter(f => fs.existsSync(f));
          const selfNames = new Set();
          const deps = new Map();
          for (const f of files) {
            const p = JSON.parse(fs.readFileSync(f, "utf8"));
            if (p.name) selfNames.add(p.name);
            for (const [k, v] of Object.entries({ ...(p.dependencies || {}), ...(p.devDependencies || {}) })) {
              if (k.startsWith("@gkucmierz/") && !String(v).startsWith("file:") && !String(v).startsWith("http")) {
                deps.set(k, String(v).replace(/^[^\d]*/, "").split("-")[0]);
              }
            }
          }
          for (const s of selfNames) deps.delete(s);
          const cmp = (a, b) => {
            const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
            for (let i = 0; i < 3; i++) if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
            return 0;
          };
          const queryReg = async (baseUrl, name, minVer) => {
            try {
              const res = await fetch(baseUrl + name.replace("/", "%2f") + "?t=" + Date.now(), { headers: { "Cache-Control": "no-cache" } });
              if (!res.ok) return null;
              const data = await res.json();
              const vers = Object.keys(data.versions || {}).filter(v => cmp(v, minVer) >= 0).sort(cmp);
              if (vers.length === 0) return null;
              const latest = vers[vers.length - 1];
              const tarball = data.versions?.[latest]?.dist?.tarball || null;
              return { version: latest, tarball };
            } catch {
              return null;
            }
          };
          (async () => {
            const deadline = Date.now() + (Number(process.env.WAIT_FOR_DEPS_TIMEOUT_SEC || 180) * 1000);
            const giteaOverrides = new Map();
            for (const [name, minVer] of deps.entries()) {
              while (true) {
                const [npmHit, giteaHit] = await Promise.all([
                  queryReg("https://registry.npmjs.org/", name, minVer),
                  queryReg("https://gitea.7u.pl/api/packages/gkucmierz/npm/", name, minVer)
                ]);
                if (giteaHit) {
                  console.log("✅ [wait-for-deps] " + name + " >= " + minVer + " dostępny w Gitea Packages (" + giteaHit.version + ")");
                  if (giteaHit.tarball) giteaOverrides.set(name, giteaHit.tarball);
                  break;
                }
                if (npmHit) {
                  console.log("✅ [wait-for-deps] " + name + " >= " + minVer + " dostępny w npmjs (" + npmHit.version + ")");
                  if (npmHit.tarball) giteaOverrides.set(name, npmHit.tarball);
                  break;
                }
                if (Date.now() >= deadline) {
                  console.error("❌ [wait-for-deps] Timeout oczekiwania na " + name + ">=" + minVer + " (npmjs + Gitea Packages)");
                  process.exit(1);
                }
                console.log("⏳ [wait-for-deps] Czekam 5s na publikację " + name + ">=" + minVer + " (npmjs / Gitea Packages)...");
                await new Promise(r => setTimeout(r, 5000));
              }
            }
            if (giteaOverrides.size > 0) {
              const path = require("path");
              let anyChanged = false;
              for (const f of files) {
                const p = JSON.parse(fs.readFileSync(f, "utf8"));
                let changed = false;
                for (const [depName, tarballUrl] of giteaOverrides.entries()) {
                  if (p.dependencies && p.dependencies[depName]) {
                    p.dependencies[depName] = tarballUrl;
                    changed = true;
                  }
                  if (p.devDependencies && p.devDependencies[depName]) {
                    p.devDependencies[depName] = tarballUrl;
                    changed = true;
                  }
                }
                if (changed) {
                  anyChanged = true;
                  fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
                  const lockPath = path.join(path.dirname(f), "package-lock.json");
                  if (fs.existsSync(lockPath)) fs.unlinkSync(lockPath);
                  console.log("🔗 [wait-for-deps] Zmapowano pakiety @gkucmierz/* na bezpośrednie tarballe w " + f);
                }
              }
              if (anyChanged) {
                for (const df of ["Dockerfile", "ui/Dockerfile", "server/Dockerfile", "crawler/Dockerfile"].filter(d => fs.existsSync(d))) {
                  const content = fs.readFileSync(df, "utf8");
                  const next = content.replace(/\bnpm\s+ci\b/g, "npm install");
                  if (next !== content) fs.writeFileSync(df, next);
                }
              }
            }
          })();
          '

      - name: Build and deploy with Docker Compose (Zero-Downtime)
        run: |
          CONTAINER="${{ inputs.container_name }}"
          HOT_SWAP="${{ inputs.hot_swap_static }}"
          docker compose build
          if [ "$HOT_SWAP" = "true" ] && [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
            IMG_NAME=$(docker compose config --images 2>/dev/null | head -n 1)
            IMG_ID=$(docker image inspect -f '{{.Id}}' "$IMG_NAME" 2>/dev/null | head -n 1)
            if [ -n "$IMG_ID" ]; then
              TMP_CID=$(docker create "$IMG_ID")
              TMP_DIR=$(mktemp -d)
              docker cp "$TMP_CID:/usr/share/nginx/html/." "$TMP_DIR/"
              docker cp "$TMP_DIR/." "$CONTAINER:/usr/share/nginx/html/"
              docker cp "$TMP_CID:/etc/nginx/conf.d/default.conf" "$TMP_DIR/default.conf" 2>/dev/null && docker cp "$TMP_DIR/default.conf" "$CONTAINER:/etc/nginx/conf.d/default.conf" 2>/dev/null || true
              rm -rf "$TMP_DIR"
              docker rm -f "$TMP_CID" >/dev/null 2>&1 || true
              docker exec "$CONTAINER" nginx -s reload
            else
              docker compose up -d --remove-orphans
            fi
          else
            docker compose up -d --remove-orphans
          fi
          for npm_cid in $(docker ps -q --filter "ancestor=jc21/nginx-proxy-manager" --filter "status=running"); do
            docker exec "$npm_cid" nginx -s reload 2>/dev/null || true
          done

      - name: Post-Deploy Smoke Test
        if: ${{ inputs.healthcheck_url != '' }}
        run: |
          URL="${{ inputs.healthcheck_url }}"
          CONTAINER="${{ inputs.container_name }}"
          echo "🔍 Smoke-testing $URL (container: $CONTAINER) ..."
          for i in 1 2 3 4 5; do
            STATUS=$(node -e "fetch(process.argv[1]).then(r => console.log(r.status)).catch(() => console.log('000'))" "$URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ Smoke test passed ($URL -> HTTP $STATUS)"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
              if docker exec "$CONTAINER" wget -q -O /dev/null http://127.0.0.1:80/ 2>/dev/null; then
                echo "✅ Smoke test passed via internal container probe ($CONTAINER -> 127.0.0.1:80 HTTP 200)"
                exit 0
              fi
            fi
            echo "⏳ Attempt $i/5 returned HTTP $STATUS, retrying in 2s..."
            sleep 2
          done
          echo "❌ Smoke test failed for $URL"
          docker logs "$CONTAINER" --tail 40 || true
          exit 1
