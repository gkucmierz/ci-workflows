name: Reusable Zero-Downtime Build & Deploy (with Dependency Readiness Gate)

on:
  workflow_call:
    inputs:
      container_name:
        description: 'Nazwa kontenera Docker (np. science-blog)'
        required: true
        type: string
      runs_on:
        description: 'Etykieta runnera Gitea (self-hosted-pl lub self-hosted-de)'
        required: false
        type: string
        default: 'self-hosted-pl'
      hot_swap_static:
        description: 'Atomowy hot-swap statycznych plików Nginx (true dla SPA/VitePress, false dla backendów Node)'
        required: false
        type: boolean
        default: true
      wait_timeout_sec:
        description: 'Limit czasu oczekiwania na publikację zależności @gkucmierz/* w NPM (s)'
        required: false
        type: number
        default: 180
      healthcheck_url:
        description: 'Opcjonalny URL lokalnego smoke-testu HTTP po wdrożeniu (np. http://localhost:6162/)'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy (${{ inputs.container_name }})
    runs-on: self-hosted-pl
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Wait for @gkucmierz/* dependencies (NPM & Gitea Packages)
        env:
          WAIT_FOR_DEPS_TIMEOUT_SEC: ${{ inputs.wait_timeout_sec }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");
          const files = ["package.json", "ui/package.json", "server/package.json", "crawler/package.json", "client/package.json", "app/package.json", "web/package.json"].filter(f => fs.existsSync(f));
          const cmp = (a, b) => {
            const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
            for (let i = 0; i < 3; i++) if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
            return 0;
          };
          const selfNames = new Set();
          const deps = new Map();
          for (const f of files) {
            const p = JSON.parse(fs.readFileSync(f, "utf8"));
            if (p.name) selfNames.add(p.name);
            for (const [k, v] of Object.entries({ ...(p.dependencies || {}), ...(p.devDependencies || {}) })) {
              if (k.startsWith("@gkucmierz/") && !String(v).startsWith("file:") && !String(v).startsWith("http")) {
                const ver = String(v).replace(/^[^\d]*/, "").split("-")[0] || "0.0.0";
                if (!deps.has(k) || cmp(ver, deps.get(k)) > 0) {
                  deps.set(k, ver);
                }
              }
            }
          }
          for (const s of selfNames) deps.delete(s);
          const queryReg = async (baseUrl, name, minVer) => {
            try {
              const res = await fetch(baseUrl + name.replace("/", "%2f") + "?t=" + Date.now(), { headers: { "Cache-Control": "no-cache" } });
              if (!res.ok) return null;
              const data = await res.json();
              const vers = Object.keys(data.versions || {}).filter(v => cmp(v, minVer) >= 0).sort(cmp);
              if (vers.length === 0) return null;
              const latest = vers[vers.length - 1];
              const tarball = data.versions?.[latest]?.dist?.tarball || null;
              return { version: latest, tarball };
            } catch {
              return null;
            }
          };
          (async () => {
            const deadline = Date.now() + (Number(process.env.WAIT_FOR_DEPS_TIMEOUT_SEC || 180) * 1000);
            const resolvedBuffers = new Map();
            const queue = Array.from(deps.entries());
            while (queue.length > 0) {
              const [name, minVer] = queue.shift();
              if (resolvedBuffers.has(name) && cmp(resolvedBuffers.get(name).version, minVer) >= 0) continue;
              let hit = null;
              while (true) {
                const [npmHit, giteaHit] = await Promise.all([
                  queryReg("https://registry.npmjs.org/", name, minVer),
                  queryReg("https://gitea.7u.pl/api/packages/gkucmierz/npm/", name, minVer)
                ]);
                if (giteaHit && giteaHit.tarball) {
                  console.log("✅ [wait-for-deps] " + name + " >= " + minVer + " dostępny w Gitea Packages (" + giteaHit.version + ")");
                  hit = giteaHit;
                  break;
                }
                if (npmHit && npmHit.tarball) {
                  console.log("✅ [wait-for-deps] " + name + " >= " + minVer + " dostępny w npmjs (" + npmHit.version + ")");
                  hit = npmHit;
                  break;
                }
                if (Date.now() >= deadline) {
                  console.error("❌ [wait-for-deps] Timeout oczekiwania na " + name + ">=" + minVer + " (npmjs + Gitea Packages)");
                  process.exit(1);
                }
                console.log("⏳ [wait-for-deps] Czekam 5s na publikację " + name + ">=" + minVer + " (npmjs / Gitea Packages)...");
                await new Promise(r => setTimeout(r, 5000));
              }
              const tRes = await fetch(hit.tarball);
              if (!tRes.ok) {
                console.error("❌ [wait-for-deps] Nie udało się pobrać tarballa " + hit.tarball + " (HTTP " + tRes.status + ")");
                process.exit(1);
              }
              const buf = Buffer.from(await tRes.arrayBuffer());
              const safeFile = name.replace(/^@/, "").replace(/\//g, "-") + ".tgz";
              resolvedBuffers.set(name, { version: hit.version, safeFile, buf });
              try {
                const tmpTgz = path.join("/tmp", safeFile);
                fs.writeFileSync(tmpTgz, buf);
                const innerPkgRaw = execFileSync("tar", ["-xzOf", tmpTgz, "package/package.json"], { encoding: "utf8" });
                fs.unlinkSync(tmpTgz);
                const innerPkg = JSON.parse(innerPkgRaw);
                for (const [tk, tv] of Object.entries(innerPkg.dependencies || {})) {
                  if (tk.startsWith("@gkucmierz/") && !selfNames.has(tk)) {
                    const tVer = String(tv).replace(/^[^\d]*/, "").split("-")[0] || "0.0.0";
                    if (!resolvedBuffers.has(tk) || cmp(tVer, resolvedBuffers.get(tk).version) > 0) {
                      queue.push([tk, tVer]);
                    }
                  }
                }
              } catch {}
            }
            if (resolvedBuffers.size > 0) {
              let anyChanged = false;
              for (const f of files) {
                const pkgDir = path.dirname(f);
                const p = JSON.parse(fs.readFileSync(f, "utf8"));
                const hasScoped = Object.keys({ ...(p.dependencies || {}), ...(p.devDependencies || {}) }).some(k => resolvedBuffers.has(k));
                if (!hasScoped) continue;
                const vendorDir = path.join(pkgDir, "vendor-tarballs");
                fs.mkdirSync(vendorDir, { recursive: true });
                p.dependencies = p.dependencies || {};
                p.overrides = p.overrides || {};
                for (const [depName, info] of resolvedBuffers.entries()) {
                  fs.writeFileSync(path.join(vendorDir, info.safeFile), info.buf);
                  const localRef = "file:./vendor-tarballs/" + info.safeFile;
                  if (p.dependencies[depName] || (!p.devDependencies?.[depName])) {
                    p.dependencies[depName] = localRef;
                  }
                  if (p.devDependencies && p.devDependencies[depName]) {
                    p.devDependencies[depName] = localRef;
                  }
                  p.overrides[depName] = localRef;
                }
                anyChanged = true;
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
                const lockPath = path.join(pkgDir, "package-lock.json");
                if (fs.existsSync(lockPath)) fs.unlinkSync(lockPath);
                const npmrcPath = path.join(pkgDir, ".npmrc");
                if (fs.existsSync(npmrcPath)) {
                  const cleaned = fs.readFileSync(npmrcPath, "utf8").split("\n").filter(l => !l.includes("gitea.7u.pl")).join("\n");
                  fs.writeFileSync(npmrcPath, cleaned);
                }
                console.log("📦 [wait-for-deps] Zapisano lokalne tarballe @gkucmierz/* w " + vendorDir + " i zaktualizowano " + f);
              }
              if (anyChanged) {
                if (fs.existsSync(".npmrc")) {
                  const cleaned = fs.readFileSync(".npmrc", "utf8").split("\n").filter(l => !l.includes("gitea.7u.pl")).join("\n");
                  fs.writeFileSync(".npmrc", cleaned);
                }
                for (const df of ["Dockerfile", "ui/Dockerfile", "server/Dockerfile", "crawler/Dockerfile"].filter(d => fs.existsSync(d))) {
                  let content = fs.readFileSync(df, "utf8").replace(/\bnpm\s+ci\b/g, "npm install");
                  if (!content.includes("vendor-tarballs")) {
                    content = content.replace(/^(COPY\s+package)/m, "COPY vendor-tarballs* ./vendor-tarballs/\n$1");
                  }
                  fs.writeFileSync(df, content);
                }
              }
            }
          })();
          '

      - name: Build and deploy with Docker Compose (Zero-Downtime)
        run: |
          CONTAINER="${{ inputs.container_name }}"
          HOT_SWAP="${{ inputs.hot_swap_static }}"
          docker compose build
          if [ "$HOT_SWAP" = "true" ] && [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
            IMG_NAME=$(docker compose config --images 2>/dev/null | head -n 1)
            IMG_ID=$(docker image inspect -f '{{.Id}}' "$IMG_NAME" 2>/dev/null | head -n 1)
            if [ -n "$IMG_ID" ]; then
              TMP_CID=$(docker create "$IMG_ID")
              TMP_DIR=$(mktemp -d)
              docker cp "$TMP_CID:/usr/share/nginx/html/." "$TMP_DIR/"
              docker cp "$TMP_DIR/." "$CONTAINER:/usr/share/nginx/html/"
              docker cp "$TMP_CID:/etc/nginx/conf.d/default.conf" "$TMP_DIR/default.conf" 2>/dev/null && docker cp "$TMP_DIR/default.conf" "$CONTAINER:/etc/nginx/conf.d/default.conf" 2>/dev/null || true
              rm -rf "$TMP_DIR"
              docker rm -f "$TMP_CID" >/dev/null 2>&1 || true
              docker exec "$CONTAINER" nginx -s reload
            else
              docker compose up -d --remove-orphans
            fi
          else
            docker compose up -d --remove-orphans
          fi
          for npm_cid in $(docker ps -q --filter "ancestor=jc21/nginx-proxy-manager" --filter "status=running"); do
            docker exec "$npm_cid" nginx -s reload 2>/dev/null || true
          done

      - name: Post-Deploy Auto Smoke Test (Internal Container Probe & Homepage)
        run: |
          URL="${{ inputs.healthcheck_url }}"
          if [ -z "$URL" ] && [ -f package.json ]; then
            URL=$(node -e 'try { const p = JSON.parse(require("fs").readFileSync("package.json","utf8")); if (p.homepage && p.homepage.startsWith("http")) console.log(p.homepage); } catch {}' 2>/dev/null || echo "")
          fi
          CONTAINER="${{ inputs.container_name }}"
          echo "🔍 Smoke-testing container: $CONTAINER ${URL:+(url: $URL)} ..."
          for i in 1 2 3 4 5; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
              if docker exec "$CONTAINER" wget -q -O /dev/null http://127.0.0.1:80/ 2>/dev/null; then
                echo "✅ Smoke test passed via internal container probe ($CONTAINER -> 127.0.0.1:80 HTTP 200)"
                exit 0
              fi
            fi
            if [ -n "$URL" ]; then
              STATUS=$(node -e "fetch(process.argv[1]).then(r => console.log(r.status)).catch(() => console.log('000'))" "$URL" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
                echo "✅ Smoke test passed ($URL -> HTTP $STATUS)"
                exit 0
              fi
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ] && [ -z "$URL" ]; then
              echo "✅ Container $CONTAINER is running"
              exit 0
            fi
            echo "⏳ Attempt $i/5 waiting for $CONTAINER readiness, retrying in 2s..."
            sleep 2
          done
          echo "❌ Smoke test failed for $CONTAINER"
          docker logs "$CONTAINER" --tail 40 || true
          exit 1

      - name: Sync Gitea Repository Website & Description Metadata
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || gitea.token }}
          HC_URL: ${{ inputs.healthcheck_url }}
        run: |
          node -e '
          const fs = require("fs");
          const token = process.env.REPO_TOKEN || "";
          const repoSlug = process.env.GITHUB_REPOSITORY || "";
          if (!token || !repoSlug) process.exit(0);
          let pkg = {};
          try { pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); } catch {}
          const hcUrl = process.env.HC_URL || "";
          const website = pkg.homepage || (hcUrl.startsWith("https://") ? hcUrl.replace(/\/+$/, "") : "");
          const description = (pkg.description || "").trim();
          if (!website && !description) process.exit(0);
          const body = {};
          if (website) body.website = website;
          if (description) body.description = description;
          fetch("https://gitea.7u.pl/api/v1/repos/" + repoSlug, {
            method: "PATCH",
            headers: {
              "Authorization": "token " + token,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          }).then(r => console.log("🔗 [Gitea Repo Metadata] PATCH /repos/" + repoSlug + " -> HTTP " + r.status)).catch(() => {});
          '
