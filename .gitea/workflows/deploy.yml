name: Build SPA, Publish Package (Gitea + NPM) & Zero-Downtime Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release_and_deploy:
    name: Sanitize, Dual-Publish NPM & Zero-Downtime Deploy
    runs-on: self-hosted-pl
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run Unit Tests & Anti-Token-Slicing OPSEC Gate
        uses: ./oss-sanitize-gate
        with:
          run_tests: 'true'

      - name: Publish Package (Gitea Packages Only — Private Repo)
        uses: ./publish-npm-dual
        with:
          run_build: 'false'
          publish_npmjs: 'false'
          publish_private: 'true'
          private_token: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Zero-Downtime SPA Build & Nginx Hot-Swap
        uses: ./zero-downtime-swap
        with:
          container_name: ci-workflows
          hot_swap_static: 'true'
          healthcheck_url: ${{ vars.HEALTHCHECK_URL || '' }}

      - name: Refresh act_runner cache for ci-workflows across all runner containers
        if: always()
        run: |
          purge_dir() {
            for d in /root/.cache/act/* /data/.cache/act/*; do
              if [ -d "$d/.git" ] && git -C "$d" remote -v 2>/dev/null | grep -q "ci-workflows"; then
                echo "🧹 Purging local cached ci-workflows action dir: $d"
                rm -rf "$d" || true
              fi
            done
          }
          purge_dir
          for r in $(docker ps --format '{{.Names}}' 2>/dev/null | grep -E 'runner'); do
            echo "🧹 Broadcasting ci-workflows act cache purge to container: $r"
            docker exec "$r" sh -c '
              for d in /root/.cache/act/* /data/.cache/act/*; do
                if [ -d "$d/.git" ] && git -C "$d" remote -v 2>/dev/null | grep -q "ci-workflows"; then
                  rm -rf "$d" || true
                fi
              done
            ' 2>/dev/null || true
          done

  purge_de_runner_cache:
    name: Purge Stale ci-workflows Act Cache on DE Runner
    needs: release_and_deploy
    if: always()
    runs-on: self-hosted-de
    timeout-minutes: 5
    steps:
      - name: Purge cached ci-workflows clones on self-hosted-de
        run: |
          for d in /root/.cache/act/* /data/.cache/act/*; do
            if [ -d "$d/.git" ] && git -C "$d" remote -v 2>/dev/null | grep -q "ci-workflows"; then
              echo "🧹 [DE Runner] Purging cached ci-workflows action dir: $d"
              rm -rf "$d" || true
            fi
          done
