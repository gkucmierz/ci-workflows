name: Reusable Package Test, Sanitize & Dual Registry Publish (npmjs + Gitea/Private)

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Etykieta runnera Gitea (domyślnie self-hosted-pl)'
        required: false
        type: string
        default: 'self-hosted-pl'
      run_tests:
        description: 'Uruchamiaj npm test przed publikacją (jeśli zdefiniowano w package.json)'
        required: false
        type: boolean
        default: true
      run_build:
        description: 'Uruchamiaj npm run build przed publikacją (jeśli zdefiniowano w package.json)'
        required: false
        type: boolean
        default: true
      publish_npmjs:
        description: 'Publikuj w publicznym rejestrze https://registry.npmjs.org'
        required: false
        type: boolean
        default: true
      publish_private:
        description: 'Publikuj w prywatnym rejestrze (np. Gitea Packages / Gitee / Verdaccio)'
        required: false
        type: boolean
        default: true
      private_registry_url:
        description: 'URL prywatnego rejestru NPM (domyślnie wyliczany dynamicznie z kontekstu serwera i właściciela)'
        required: false
        type: string
        default: ''
      gitea_owner:
        description: 'Właściciel lub organizacja w Gitea / GitHub (domyślnie wykrywany z kontekstu repozytorium)'
        required: false
        type: string
        default: ''
      package_scope:
        description: 'Prefiks scope paczek wewnętrznych NPM, np. @acme/ (domyślnie wykrywany dynamicznie)'
        required: false
        type: string
        default: ''
      internal_packages:
        description: 'Opcjonalna lista dodatkowych paczek wewnętrznych (CSV)'
        required: false
        type: string
        default: ''
      oss_sanitize_check:
        description: 'Blokuj publikację w razie wykrycia lokalnych ścieżek /Users/... lub sekretów'
        required: false
        type: boolean
        default: true
    secrets:
      NPM_AUTH_TOKEN:
        description: 'Token autoryzacyjny do registry.npmjs.org'
        required: false
      LOCAL_PACKAGE_REGISTRY:
        description: 'Token autoryzacyjny do prywatnego rejestru Gitea / Gitee'
        required: false

jobs:
  publish:
    name: Test, Verify & Publish Package
    runs-on: ${{ inputs.runs_on || 'self-hosted-pl' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: OSS Sanitization Gate (Leak Prevention)
        if: ${{ inputs.oss_sanitize_check }}
        run: |
          node -e '
          const { execFileSync } = require("child_process");
          const fs = require("fs");
          const path = require("path");
          let files = [];
          try {
            files = execFileSync("git", ["ls-files"], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).split("\n").filter(Boolean);
          } catch {
            const walk = (d, pre = "") => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                if ([".git", "node_modules", "dist", "coverage", ".agents", ".agent", "code-recipes"].includes(e.name)) continue;
                const rel = pre ? `${pre}/${e.name}` : e.name;
                if (e.isDirectory()) walk(path.join(d, e.name), rel);
                else if (e.isFile()) files.push(rel);
              }
            };
            walk(process.cwd());
          }
          const forbidden = [
            { name: "Local macOS User Path", re: new RegExp("\\x2fUsers\\x2f[a-zA-Z0-9][a-zA-Z0-9._-]*\\x2f") },
            { name: "Private Key Block", re: new RegExp("-----BEGIN (RSA |OPENSSH |EC |PGP )?PRIVATE KEY-----") },
            { name: "Sliced Token Prefix", re: /[\x27\x22\x60](?:ghp_|github_pat_|npm_|glpat-|sk-proj-|AIza)[\x27\x22\x60]\s*\+/ },
            { name: "Partial Secret Slicing", re: /(?:TOKEN|SECRET|PASSWORD|API_KEY|PAT)\s*(?:\]\s*)?\.\s*(?:slice|substring|substr|split)\s*\(/i }
          ];
          const hits = [];
          for (const f of files) {
            if (f.startsWith(".agents/") || f.startsWith(".agent/") || f === "AGENTS.md" || f === "agents.md" || f.startsWith("code-recipes/")) {
              hits.push(`${f}: tracked .agents / AGENTS.md / code-recipes file is forbidden in OSS packages`);
              continue;
            }
            if (f === "src/sanitizeRepo.mjs" || f.startsWith("tests/")) continue;
            if (!/\.(js|mjs|cjs|ts|vue|json|md|yml|yaml|html|css)$/.test(f)) continue;
            const content = fs.readFileSync(f, "utf8");
            for (const rule of forbidden) {
              if (rule.re.test(content)) hits.push(`${f}: matched ${rule.name}`);
            }
          }
          if (hits.length > 0) {
            console.error("❌ [oss-sanitize-gate] Blocked publish due to sensitive patterns:\n" + hits.join("\n"));
            process.exit(1);
          }
          console.log("✅ [oss-sanitize-gate] Clean (" + files.length + " tracked files verified).");
          '

      - name: Install dependencies, test & build (auto-detected from package.json)
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
          RUN_BUILD: ${{ inputs.run_build }}
          GITEA_PKG_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || github.token }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPO_FULL: ${{ github.repository }}
          GITEA_OWNER_INPUT: ${{ inputs.gitea_owner }}
          PACKAGE_SCOPE_INPUT: ${{ inputs.package_scope }}
          PRIVATE_REGISTRY_INPUT: ${{ inputs.private_registry_url }}
          INTERNAL_PACKAGES_INPUT: ${{ inputs.internal_packages }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync, execFileSync } = require("child_process");
          const rawPkg = fs.readFileSync("package.json", "utf8");
          const rawNpmrc = fs.existsSync(".npmrc") ? fs.readFileSync(".npmrc", "utf8") : null;
          const pkg = JSON.parse(rawPkg);
          const allDeps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
          const hasDeps = Object.keys(allDeps).length > 0;
          const giteaToken = process.env.GITEA_PKG_TOKEN || "";

          let npmrcScope = "";
          let npmrcRegistry = "";
          if (rawNpmrc) {
            for (const line of rawNpmrc.split("\n")) {
              const t = line.trim();
              if (!t || t.startsWith("#") || t.startsWith(";")) continue;
              const sm = t.match(/^(@[^:=\s]+):registry\s*=\s*(\S+)/);
              if (sm) {
                if (!npmrcScope) npmrcScope = sm[1];
                if (!npmrcRegistry && !sm[2].includes("registry.npmjs.org")) npmrcRegistry = sm[2];
                continue;
              }
              const pm = t.match(/^registry\s*=\s*(\S+)/);
              if (pm && !pm[1].includes("registry.npmjs.org") && !npmrcRegistry) npmrcRegistry = pm[1];
            }
          }
          const safeOrigin = (u) => { try { return u ? new URL(String(u).trim()).origin : ""; } catch { return ""; } };
          const safeHost = (u) => { try { return u ? new URL(String(u).trim()).host.toLowerCase() : ""; } catch { return ""; } };
          const normalizeScope = (s) => {
            const t = String(s || "").trim();
            if (!t) return "";
            const a = t.startsWith("@") ? t : "@" + t;
            return a.endsWith("/") ? a : a + "/";
          };
          const npmrcOwnerMatch = npmrcRegistry.match(/\/api\/packages\/([^/]+)\/npm/i);
          const npmrcOwner = npmrcOwnerMatch ? decodeURIComponent(npmrcOwnerMatch[1]) : "";
          const repoFull = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
          const repoSlugOwner = repoFull.includes("/") ? repoFull.split("/")[0].trim() : "";
          const pkgScopeOwner = (pkg.name && String(pkg.name).startsWith("@") && String(pkg.name).includes("/"))
            ? String(pkg.name).slice(1).split("/")[0]
            : "";
          const repoOwner = String(
            process.env.GITEA_OWNER_INPUT ||
            process.env.GITHUB_REPOSITORY_OWNER ||
            repoSlugOwner ||
            npmrcOwner ||
            pkgScopeOwner ||
            ""
          ).trim();
          const scopePrefix =
            normalizeScope(process.env.PACKAGE_SCOPE_INPUT) ||
            normalizeScope(npmrcScope) ||
            (repoOwner ? "@" + repoOwner + "/" : "") ||
            (pkgScopeOwner ? "@" + pkgScopeOwner + "/" : "");
          const serverOrigin =
            safeOrigin(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL) ||
            safeOrigin(process.env.PRIVATE_REGISTRY_INPUT) ||
            safeOrigin(npmrcRegistry);
          const apiBase = (
            String(process.env.GITEA_API_URL || process.env.GITHUB_API_URL || "").trim() ||
            (serverOrigin ? serverOrigin + "/api/v1" : "")
          ).replace(/\/+$/, "");
          const internalApiBase = serverOrigin && !serverOrigin.includes("github.com") ? "http://gitea:3000/api/v1" : "";
          const apiBases = Array.from(new Set([internalApiBase, apiBase].filter(Boolean)));
          const rawPrivReg =
            String(process.env.PRIVATE_REGISTRY_INPUT || "").trim() ||
            npmrcRegistry ||
            (serverOrigin && repoOwner && !serverOrigin.includes("github.com")
              ? serverOrigin + "/api/packages/" + encodeURIComponent(repoOwner) + "/npm/"
              : "");
          const privateRegUrl = rawPrivReg ? rawPrivReg.replace(/\/+$/, "") + "/" : "";
          const internalBridgeRegUrl = privateRegUrl.includes("/api/packages/")
            ? privateRegUrl.replace(/^https?:\/\/[^/]+\//, "http://gitea:3000/")
            : "";
          const privateHosts = new Set(
            [safeHost(serverOrigin), safeHost(privateRegUrl), safeHost(apiBase), "gitea:3000"].filter(
              h => h && h !== "registry.npmjs.org" && h !== "registry.yarnpkg.com" && h !== "github.com" && h !== "api.github.com"
            )
          );
          const isPrivateHostUrl = (s) => {
            const str = String(s || "");
            if (!str || str.includes("registry.npmjs.org")) return false;
            if (str.includes("/api/packages/") || str.includes("gitea:3000")) return true;
            const lower = str.toLowerCase();
            for (const h of privateHosts) {
              if (lower.includes(h)) return true;
            }
            return false;
          };
          const extractMinVer = (verSpec) => {
            const s = String(verSpec || "");
            const urlMatch = s.match(/\/-\/(\d+\.\d+\.\d+)(?:\/|$)/) || s.match(/-(\d+\.\d+\.\d+)\.tgz/);
            if (urlMatch) return urlMatch[1];
            return s.replace(/^[^\d]*/, "").split("-")[0] || "0.0.0";
          };
          const rewriteInternalGiteaUrl = (url) => {
            if (!url || !isPrivateHostUrl(url)) return url;
            return String(url).replace(/^https?:\/\/[^/]+\//, "http://gitea:3000/");
          };
          const buildHeaders = (url) => {
            const h = { "Cache-Control": "no-cache" };
            if (giteaToken && isPrivateHostUrl(url)) {
              h["Authorization"] = "token " + giteaToken;
            }
            return h;
          };
          const ownedPackages = new Set(
            String(process.env.INTERNAL_PACKAGES_INPUT || "").split(",").map(s => s.trim()).filter(Boolean)
          );
          const checkedUnscoped = new Map();
          const discoverOwnedPackages = async () => {
            if (!repoOwner || apiBases.length === 0) return;
            for (const base of apiBases) {
              let okBase = false;
              for (let page = 1; page <= 5; page++) {
                try {
                  const u = `${base}/packages/${encodeURIComponent(repoOwner)}?type=npm&limit=100&page=${page}`;
                  const r = await fetch(u, { headers: buildHeaders(u) });
                  if (!r.ok) break;
                  okBase = true;
                  const arr = await r.json();
                  if (!Array.isArray(arr) || arr.length === 0) break;
                  for (const p of arr) if (p && p.name) ownedPackages.add(String(p.name));
                } catch { break; }
              }
              if (okBase) break;
            }
          };
          const checkUnscopedOwnedRepo = async (depName) => {
            if (!depName || depName.startsWith("@")) return false;
            if (ownedPackages.has(depName)) return true;
            if (checkedUnscoped.has(depName)) return checkedUnscoped.get(depName);
            if (!repoOwner || apiBases.length === 0) {
              checkedUnscoped.set(depName, false);
              return false;
            }
            for (const base of apiBases) {
              try {
                const u = `${base}/repos/${encodeURIComponent(repoOwner)}/${encodeURIComponent(depName)}`;
                const r = await fetch(u, { headers: buildHeaders(u) });
                if (r.status === 200) {
                  const data = await r.json();
                  const owned = Boolean(
                    data && data.fork === false && String(data.owner?.login || "").toLowerCase() === repoOwner.toLowerCase()
                  );
                  if (owned) ownedPackages.add(depName);
                  checkedUnscoped.set(depName, owned);
                  return owned;
                }
                checkedUnscoped.set(depName, false);
                return false;
              } catch {}
            }
            checkedUnscoped.set(depName, false);
            return false;
          };
          const isInternalDep = async (name, verSpec) => {
            if (!name) return false;
            if (scopePrefix && name.startsWith(scopePrefix)) return true;
            if (ownedPackages.has(name)) return true;
            if (isPrivateHostUrl(verSpec)) return true;
            if (!name.startsWith("@")) return await checkUnscopedOwnedRepo(name);
            return false;
          };
          const cmp = (a, b) => {
            const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
            for (let i = 0; i < 3; i++) if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
            return 0;
          };
          const queryReg = async (baseUrl, name, minVer) => {
            try {
              const url = baseUrl + name.replace("/", "%2f") + "?t=" + Date.now();
              const res = await fetch(url, { headers: buildHeaders(url) });
              if (!res.ok) return null;
              const data = await res.json();
              const vers = Object.keys(data.versions || {}).filter(v => cmp(v, minVer) >= 0).sort(cmp);
              if (vers.length === 0) return null;
              const latest = vers[vers.length - 1];
              const tarball = data.versions?.[latest]?.dist?.tarball || null;
              return tarball ? { version: latest, tarball } : null;
            } catch {
              return null;
            }
          };
          (async () => {
            let pkgModified = false;
            const vendorDir = path.resolve("vendor-tarballs");
            try {
              if (hasDeps) {
                await discoverOwnedPackages();
                const unscopedNames = Object.keys(allDeps).filter(n => !n.startsWith("@") && !ownedPackages.has(n));
                if (unscopedNames.length > 0) {
                  await Promise.all(unscopedNames.map(n => checkUnscopedOwnedRepo(n)));
                }
                const queue = [];
                for (const [k, v] of Object.entries(allDeps)) {
                  if ((await isInternalDep(k, v)) && !String(v).startsWith("file:")) {
                    queue.push([k, extractMinVer(v)]);
                  }
                }
                const resolved = new Map();
                while (queue.length > 0) {
                  const [k, minVer] = queue.shift();
                  if (resolved.has(k) && cmp(resolved.get(k).version, minVer) >= 0) continue;
                  const [internalGiteaHit, giteaHit, npmHit] = await Promise.all([
                    internalBridgeRegUrl && internalBridgeRegUrl !== privateRegUrl
                      ? queryReg(internalBridgeRegUrl, k, minVer)
                      : Promise.resolve(null),
                    privateRegUrl ? queryReg(privateRegUrl, k, minVer) : Promise.resolve(null),
                    queryReg("https://registry.npmjs.org/", k, minVer)
                  ]);
                  const candidates = [
                    internalGiteaHit ? { ...internalGiteaHit, tarball: rewriteInternalGiteaUrl(internalGiteaHit.tarball), prio: 3 } : null,
                    giteaHit ? { ...giteaHit, prio: 2 } : null,
                    npmHit ? { ...npmHit, prio: 1 } : null
                  ].filter(Boolean);
                  if (candidates.length === 0) continue;
                  candidates.sort((a, b) => {
                    const vd = cmp(b.version, a.version);
                    return vd !== 0 ? vd : b.prio - a.prio;
                  });
                  const hit = candidates[0];
                  let tRes = await fetch(hit.tarball, { headers: buildHeaders(hit.tarball) }).catch(() => null);
                  if ((!tRes || !tRes.ok) && isPrivateHostUrl(hit.tarball) && !String(hit.tarball).startsWith("http://gitea:3000/")) {
                    const altUrl = rewriteInternalGiteaUrl(hit.tarball);
                    tRes = await fetch(altUrl, { headers: buildHeaders(altUrl) }).catch(() => null);
                  }
                  if (!tRes || !tRes.ok) continue;
                  let buf = Buffer.from(await tRes.arrayBuffer());
                  fs.mkdirSync(vendorDir, { recursive: true });
                  const safeFile = k.replace(/^@/, "").replace(/\//g, "-") + ".tgz";
                  const tgzPath = path.join(vendorDir, safeFile);
                  fs.writeFileSync(tgzPath, buf);
                  try {
                    const innerRaw = execFileSync("tar", ["-xzOf", tgzPath, "package/package.json"], { encoding: "utf8" });
                    const innerPkg = JSON.parse(innerRaw);
                    let innerModified = false;
                    for (const [tk, tv] of Object.entries(innerPkg.dependencies || {})) {
                      if ((await isInternalDep(tk, tv)) && tk !== pkg.name) {
                        const tVer = extractMinVer(tv);
                        if (!resolved.has(tk) || cmp(tVer, resolved.get(tk).version) > 0) queue.push([tk, tVer]);
                        if (isPrivateHostUrl(tv)) {
                          innerPkg.dependencies[tk] = "^" + (tVer === "0.0.0" ? "1.0.0" : tVer);
                          innerModified = true;
                        }
                      }
                    }
                    if (innerModified) {
                      const repackDir = path.join("/tmp", "repack-" + Date.now() + "-" + Math.random().toString(36).slice(2));
                      fs.mkdirSync(repackDir, { recursive: true });
                      execFileSync("tar", ["-xzf", tgzPath, "-C", repackDir]);
                      fs.writeFileSync(path.join(repackDir, "package", "package.json"), JSON.stringify(innerPkg, null, 2) + "\n");
                      execFileSync("tar", ["-czf", tgzPath, "-C", repackDir, "package"]);
                      fs.rmSync(repackDir, { recursive: true, force: true });
                    }
                  } catch {}
                  resolved.set(k, { version: hit.version, localRef: "file:./vendor-tarballs/" + safeFile });
                }
                if (resolved.size > 0) {
                  pkg.dependencies = pkg.dependencies || {};
                  pkg.overrides = pkg.overrides || {};
                  for (const [depName, info] of resolved.entries()) {
                    if (pkg.dependencies[depName] || (!pkg.devDependencies?.[depName])) pkg.dependencies[depName] = info.localRef;
                    if (pkg.devDependencies && pkg.devDependencies[depName]) pkg.devDependencies[depName] = info.localRef;
                    pkg.overrides[depName] = info.localRef;
                  }
                  pkgModified = true;
                  fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
                  if (rawNpmrc !== null) {
                    fs.writeFileSync(".npmrc", rawNpmrc.split("\n").filter(l => !isPrivateHostUrl(l)).join("\n"));
                  }
                  execSync("npm install --no-package-lock", { stdio: "inherit" });
                  fs.writeFileSync("package.json", rawPkg);
                  if (rawNpmrc !== null) fs.writeFileSync(".npmrc", rawNpmrc);
                  fs.rmSync(vendorDir, { recursive: true, force: true });
                  pkgModified = false;
                } else {
                  execSync(fs.existsSync("package-lock.json") ? "npm ci" : "npm install", { stdio: "inherit" });
                }
              }
              if (process.env.RUN_TESTS === "true" && pkg.scripts && pkg.scripts.test) {
                console.log("▶ Running npm test...");
                execSync("npm test", { stdio: "inherit" });
              }
              if (process.env.RUN_BUILD === "true" && pkg.scripts && pkg.scripts.build) {
                console.log("▶ Running npm run build...");
                execSync("npm run build", { stdio: "inherit" });
              }
            } finally {
              if (pkgModified) {
                fs.writeFileSync("package.json", rawPkg);
                if (rawNpmrc !== null) fs.writeFileSync(".npmrc", rawNpmrc);
                fs.rmSync(vendorDir, { recursive: true, force: true });
              }
            }
          })();
          '

      - name: Publish to Private Registry (Gitea / Gitee / Internal — Primary)
        if: ${{ inputs.publish_private }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          PRIVATE_REGISTRY: ${{ inputs.private_registry_url }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPO_FULL: ${{ github.repository }}
          GITEA_OWNER_INPUT: ${{ inputs.gitea_owner }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ LOCAL_PACKAGE_REGISTRY is not set, skipping private registry publish."
            exit 0
          fi
          REG_CLEAN=$(node -e '
            const fs = require("fs");
            const explicit = String(process.env.PRIVATE_REGISTRY || "").trim();
            if (explicit) { console.log(explicit.replace(/\/+$/, "") + "/"); process.exit(0); }
            let npmrcReg = "";
            if (fs.existsSync(".npmrc")) {
              for (const l of fs.readFileSync(".npmrc", "utf8").split("\n")) {
                const m = l.trim().match(/^(?:@[^:=\s]+:)?registry\s*=\s*(\S+)/);
                if (m && !m[1].includes("registry.npmjs.org")) { npmrcReg = m[1]; break; }
              }
            }
            if (npmrcReg) { console.log(npmrcReg.replace(/\/+$/, "") + "/"); process.exit(0); }
            let srv = "";
            try { srv = new URL(String(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL || "").trim()).origin; } catch {}
            const repoFull = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
            const owner = String(process.env.GITEA_OWNER_INPUT || process.env.GITHUB_REPOSITORY_OWNER || (repoFull.includes("/") ? repoFull.split("/")[0] : "")).trim();
            if (srv && owner && !srv.includes("github.com")) {
              console.log(`${srv}/api/packages/${encodeURIComponent(owner)}/npm/`);
            }
          ')
          if [ -z "$REG_CLEAN" ]; then
            echo "⚠️ Private registry URL could not be resolved, skipping private registry publish."
            exit 0
          fi
          TMP_NPMRC=$(mktemp)
          cp package.json package.json.gitea.bak
          trap 'mv -f package.json.gitea.bak package.json 2>/dev/null || true; rm -f "$TMP_NPMRC"' EXIT
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json.gitea.bak", "utf8"));
            if (p.private === true) {
              delete p.private;
              fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            }
          '
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          SCOPE=$(node -p "const n=require('./package.json').name; n.startsWith('@') ? n.split('/')[0] : ''")
          REG_HOST=$(echo "$REG_CLEAN" | sed -E 's|^https?://||')
          if [ -n "$SCOPE" ]; then
            printf "%s:registry=%s\n" "$SCOPE" "$REG_CLEAN" >> "$TMP_NPMRC"
          fi
          printf "registry=%s\n//%s:_authToken=%s\nalways-auth=true\n" "$REG_CLEAN" "$REG_HOST" "$NODE_AUTH_TOKEN" >> "$TMP_NPMRC"
          if NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "${NAME}@${VER}" --registry="$REG_CLEAN" version >/dev/null 2>&1; then
            echo "ℹ️ ${NAME}@${VER} is already published in private registry — skipping upload."
          else
            NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm publish --registry="$REG_CLEAN" || echo "ℹ️ Private registry publish skipped (version already exists or token unauthorized)."
          fi
          mv -f package.json.gitea.bak package.json 2>/dev/null || true
          node -e '
          (async () => {
            const repoFull = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
            const token = process.env.NODE_AUTH_TOKEN || "";
            const pkgName = process.argv[1];
            if (!repoFull.includes("/") || !token || !pkgName) return;
            let srv = "";
            try { srv = new URL(String(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL || "").trim()).origin; } catch {}
            const apiBase = (String(process.env.GITEA_API_URL || process.env.GITHUB_API_URL || "").trim() || (srv ? srv + "/api/v1" : "")).replace(/\/+$/, "");
            if (!apiBase || apiBase.includes("api.github.com")) return;
            const [owner, repoName] = repoFull.split("/");
            const ownerResolved = String(process.env.GITEA_OWNER_INPUT || owner).trim();
            const url = `${apiBase}/packages/${encodeURIComponent(ownerResolved)}/npm/${encodeURIComponent(pkgName)}/-/link/${encodeURIComponent(repoName)}`;
            try {
              const res = await fetch(url, { method: "POST", headers: { Authorization: `token ${token}` } });
              if (res.status === 400 || res.status === 409) {
                console.log(`ℹ️ [Gitea Package Link] ${pkgName} already linked to ${repoFull}`);
              } else {
                console.log(`🔗 [Gitea Package Link] Linked ${pkgName} -> ${repoFull} (HTTP ${res.status})`);
              }
            } catch {}
          })();
          ' "$NAME"

      - name: Publish to Public NPM Registry (registry.npmjs.org — Secondary, Public-Only Gate)
        if: ${{ inputs.publish_npmjs }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN || secrets.NPM_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPO_FULL: ${{ github.repository }}
        run: |
          ALLOW_PUBLIC=$(node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
          const lic = String(pkg.license || "").trim().toUpperCase();
          if (pkg.private === true || !lic || lic === "UNLICENSED" || lic === "PROPRIETARY") {
            console.error(`🔒 [Privacy Gate] package.json declares private=${Boolean(pkg.private)} license="${pkg.license || "NONE"}" — strictly blocking public npmjs.org publish.`);
            console.log("BLOCK");
            process.exit(0);
          }
          if (pkg.publishConfig && pkg.publishConfig.access === "public") {
            console.log("ALLOW");
            process.exit(0);
          }
          const repoFull = String(process.env.GITEA_REPO_FULL || process.env.GITHUB_REPOSITORY || "").trim();
          let srv = "";
          try { srv = new URL(String(process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL || "").trim()).origin; } catch {}
          const apiBase = (String(process.env.GITEA_API_URL || process.env.GITHUB_API_URL || "").trim() || (srv ? srv + "/api/v1" : "")).replace(/\/+$/, "");
          if (!repoFull.includes("/") || !apiBase) {
            console.log("ALLOW");
            process.exit(0);
          }
          fetch(`${apiBase}/repos/${repoFull}`)
            .then(r => {
              if (r.status !== 200) {
                console.error(`🔒 [Privacy Gate] Repository ${repoFull} is PRIVATE (unauthenticated HTTP ${r.status}) — strictly blocking public npmjs.org publish.`);
                console.log("BLOCK");
              } else {
                console.log("ALLOW");
              }
            })
            .catch(() => console.log("ALLOW"));
          ')
          if [ "$ALLOW_PUBLIC" != "ALLOW" ]; then
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ NPM_AUTH_TOKEN is not set, skipping npmjs.org publish."
            exit 0
          fi
          TMP_NPMRC=$(mktemp)
          trap 'rm -f "$TMP_NPMRC"' EXIT
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          SCOPE=$(node -p "const n=require('./package.json').name; n.startsWith('@') ? n.split('/')[0] : ''")
          if [ -n "$SCOPE" ]; then
            printf "%s:registry=https://registry.npmjs.org/\n" "$SCOPE" >> "$TMP_NPMRC"
          fi
          printf "registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" >> "$TMP_NPMRC"
          if NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "${NAME}@${VER}" --registry="https://registry.npmjs.org/" version >/dev/null 2>&1; then
            echo "ℹ️ ${NAME}@${VER} is already published on registry.npmjs.org — skipping."
            exit 0
          fi
          NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm publish --registry="https://registry.npmjs.org/" --access public || echo "⚠️ Public npmjs.org publish skipped (token expired, 2FA required, or version already exists)."
