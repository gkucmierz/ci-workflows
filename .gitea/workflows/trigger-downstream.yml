name: Reusable Cross-Repo Workflow Dispatch Trigger

on:
  workflow_call:
    inputs:
      target_repos:
        description: 'Lista repozytoriów docelowych oddzielona przecinkami (np. acme/web-app,acme/docs-site)'
        required: true
        type: string
      workflow_file:
        description: 'Nazwa pliku workflow do wyzwolenia (domyślnie deploy.yml)'
        required: false
        type: string
        default: 'deploy.yml'
      target_ref:
        description: 'Gałąź lub tag docelowy (domyślnie main)'
        required: false
        type: string
        default: 'main'
      api_base_url:
        description: 'Bazowy URL API Gitei lub GitHuba (domyślnie wykrywany z kontekstu serwera)'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Etykieta runnera Gitea'
        required: false
        type: string
        default: 'self-hosted-pl'
    secrets:
      DISPATCH_PAT:
        description: 'Personal Access Token z uprawnieniami do wyzwalania workflow_dispatch'
        required: true

jobs:
  dispatch:
    name: Trigger Downstream Workflows
    runs-on: ${{ inputs.runs_on || 'self-hosted-pl' }}
    timeout-minutes: 5
    steps:
      - name: Dispatch downstream repository workflows
        env:
          TARGET_REPOS: ${{ inputs.target_repos }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          TARGET_REF: ${{ inputs.target_ref }}
          API_BASE: ${{ inputs.api_base_url }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_API_URL: ${{ github.api_url }}
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          node -e '
          (async () => {
            const pat = process.env.PAT;
            if (!pat) {
              console.error("❌ DISPATCH_PAT secret is missing!");
              process.exit(1);
            }
            const repos = (process.env.TARGET_REPOS || "").split(",").map(s => s.trim()).filter(Boolean);
            const wf = process.env.WORKFLOW_FILE || "deploy.yml";
            const ref = process.env.TARGET_REF || "main";
            const srv = (process.env.GITEA_SERVER_URL || process.env.GITHUB_SERVER_URL || "").trim().replace(/\/+$/, "");
            const apiBase = (
              process.env.API_BASE ||
              process.env.GITEA_API_URL ||
              process.env.GITHUB_API_URL ||
              (srv ? `${srv}/api/v1` : "")
            ).trim().replace(/\/+$/, "");
            if (!apiBase) {
              console.error("❌ Unable to resolve API base URL (set api_base_url input or GITHUB_API_URL / GITHUB_SERVER_URL).");
              process.exit(1);
            }

            for (const repo of repos) {
              const url = `${apiBase}/repos/${repo}/actions/workflows/${wf}/dispatches`;
              console.log(`▶ Triggering ${repo} (${wf} @ ${ref})...`);
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "Accept": "application/json",
                  "Authorization": `token ${pat}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ ref })
              });
              if (!res.ok) {
                const body = await res.text();
                console.error(`❌ Failed to trigger ${repo}: HTTP ${res.status} — ${body}`);
                process.exit(1);
              }
              console.log(`✅ Triggered ${repo} (HTTP ${res.status})`);
            }
          })();
          '
